    var idx = state.instructionTopics.indexOf(def);
    if(idx > -1) state.instructionTopics.splice(idx, 1);
    state.activeInstructionId = state.instructionTopics.length ? state.instructionTopics[0].id : null;
    save();
    renderSidebar();
    renderMain();
  });

  // ---- priority filter ----
  function activePriorities(){
    return Object.keys(state.priorityFilters).filter(function(p){ return state.priorityFilters[p]; });
  }
  function applyFilter(){
    var active = activePriorities();
    var rows = document.querySelectorAll(".row, .sub-row");
    rows.forEach(function(r){
      var pri = r.getAttribute("data-priority");
      if(active.length && active.indexOf(pri) === -1){
        r.classList.add("hidden");
      } else {
        r.classList.remove("hidden");
      }
    });
  }

  // ---- checklist row rendering ----
  function renderSubsection(item, row){
    var isYesNo = item.type === "yesno";
    if(isYesNo && item.answer !== "yes") return; // "No" (or unanswered) skips straight past — nothing to show
    if(!isYesNo && !item.subitems.length) return;

    var box = document.createElement("div");
    box.className = "subsection";

    var head = document.createElement("div");
    head.className = "subsection-head";

    var titleInput = document.createElement("input");
    titleInput.className = "subsection-title";
    titleInput.placeholder = isYesNo ? "If yes…" : "Additional items";
    titleInput.value = item.subsectionTitle || "";
    titleInput.addEventListener("input", function(){
      item.subsectionTitle = titleInput.value;
      save();
    });
    head.appendChild(titleInput);

    var count = document.createElement("span");
    count.className = "subsection-count";
    var doneCount = item.subitems.filter(function(sub){ return sub.done; }).length;
    count.textContent = doneCount + " / " + item.subitems.length;
    head.appendChild(count);

    box.appendChild(head);

    var list = document.createElement("div");
    list.className = "sub-rows";

    item.subitems.forEach(function(sub){
      var srow = document.createElement("div");
      srow.className = "sub-row" + (sub.done ? " done" : "");
      srow.setAttribute("data-item-id", sub.id);
      srow.setAttribute("data-priority", sub.priority || "M");

      var scheck = document.createElement("button");
      scheck.type = "button";
      scheck.className = "sub-check" + (sub.done ? " checked" : "");
      scheck.addEventListener("click", function(){
        sub.done = !sub.done;
        scheck.classList.toggle("checked", sub.done);
        srow.classList.toggle("done", sub.done);
        updateProgress();
        save();
      });
      srow.appendChild(scheck);

      var stext = document.createElement("input");
      stext.className = "sub-text";
      stext.placeholder = isYesNo ? "Follow-up item" : "Item";
      stext.value = sub.text;
      stext.spellcheck = false;
      stext.addEventListener("input", function(){
        sub.text = stext.value;
        save();
      });
      srow.appendChild(stext);

      var spri = document.createElement("select");
      spri.className = "sub-priority";
      spri.setAttribute("data-pri", sub.priority || "M");
      ["H","M","L"].forEach(function(p){
        var opt = document.createElement("option");
        opt.value = p; opt.textContent = p;
        if(p === (sub.priority || "M")) opt.selected = true;
        spri.appendChild(opt);
      });
      spri.addEventListener("change", function(){
        sub.priority = spri.value;
        spri.setAttribute("data-pri", sub.priority);
        srow.setAttribute("data-priority", sub.priority);
        applyFilter();
        save();
      });
      srow.appendChild(spri);

      var sdel = document.createElement("button");
      sdel.type = "button";
      sdel.className = "sub-del";
      sdel.innerHTML = "&times;";
      sdel.title = isYesNo ? "Remove follow-up item" : "Remove item";
      sdel.addEventListener("click", function(){
        var idx = item.subitems.indexOf(sub);
        if(idx > -1) item.subitems.splice(idx, 1);
        renderChecklist();
        save();
      });
      srow.appendChild(sdel);

      var snotes = document.createElement("input");
      snotes.className = "sub-note-line";
      snotes.placeholder = "Notes";
      snotes.value = sub.notes || "";
      snotes.addEventListener("input", function(){
        sub.notes = snotes.value;
        save();
      });
      srow.appendChild(snotes);

      list.appendChild(srow);
    });

    box.appendChild(list);

    var addRowGroup = document.createElement("div");
    addRowGroup.className = "add-row-group";

    var addMore = document.createElement("button");
    addMore.type = "button";
    addMore.className = "add-sub-item";
    addMore.textContent = isYesNo ? "+ Add follow-up item" : "+ Add item";
    addMore.addEventListener("click", function(){
      item.subitems.push(buildSubitem());
      renderChecklist();
      save();
      focusLastSubInput(item.id);
    });
    addRowGroup.appendChild(addMore);

    if(state.subsectionTemplates.length){
      var tplPicker = document.createElement("select");
      tplPicker.className = "tpl-picker";
      populateTemplateSelect(tplPicker, "subsection");
      tplPicker.addEventListener("change", function(){
        var tmpl = subsectionTemplateById(tplPicker.value);
        if(tmpl){
          if(!item.subsectionTitle) item.subsectionTitle = tmpl.title;
          tmpl.items.forEach(function(it){
            item.subitems.push({ id: uid(), text: it.text, priority: it.priority || "M", notes:"", done:false });
          });
          renderChecklist();
          save();
        }
        tplPicker.value = "";
      });
      addRowGroup.appendChild(tplPicker);
    }

    box.appendChild(addRowGroup);

    row.appendChild(box);
  }

  function focusLastSubInput(itemId){
    var rowEl = sectionsEl.querySelector('.row[data-item-id="'+itemId+'"]');
    if(!rowEl) return;
    var subs = rowEl.querySelectorAll(".sub-text");
    if(subs.length) subs[subs.length - 1].focus();
  }

  function renderRow(section, item){
    var isYesNo = item.type === "yesno";
    var row = document.createElement("div");
    row.className = "row" + (item.done ? " done" : "") + (isYesNo ? " type-yesno" : "");
    row.setAttribute("data-priority", item.priority);
    row.setAttribute("data-item-id", item.id);

    if(isYesNo){
      var ynWrap = document.createElement("div");
      ynWrap.className = "yn-toggle";

      var yesBtn = document.createElement("button");
      yesBtn.type = "button";
      yesBtn.className = "yn-btn yes" + (item.answer === "yes" ? " active" : "");
      yesBtn.textContent = "Y";
      yesBtn.title = "Yes";

      var noBtn = document.createElement("button");
      noBtn.type = "button";
      noBtn.className = "yn-btn no" + (item.answer === "no" ? " active" : "");
      noBtn.textContent = "N";
      noBtn.title = "No";

      yesBtn.addEventListener("click", function(){
        item.answer = item.answer === "yes" ? null : "yes";
        item.done = item.answer !== null;
        save();
        if(item.linkedTaskId && window.__DOCKET__ && window.__DOCKET__.setTaskDone){
          window.__DOCKET__.setTaskDone(item.linkedTaskId, item.done);
        }
        renderChecklist();
      });
      noBtn.addEventListener("click", function(){
        item.answer = item.answer === "no" ? null : "no";
        item.done = item.answer !== null;
        save();
        if(item.linkedTaskId && window.__DOCKET__ && window.__DOCKET__.setTaskDone){
          window.__DOCKET__.setTaskDone(item.linkedTaskId, item.done);
        }
        renderChecklist();
      });

      ynWrap.appendChild(yesBtn);
      ynWrap.appendChild(noBtn);
      row.appendChild(ynWrap);
    } else {
      var check = document.createElement("button");
      check.type = "button";
      check.className = "check" + (item.done ? " checked" : "");
      check.setAttribute("aria-label", "Toggle complete");
      check.addEventListener("click", function(){
        item.done = !item.done;
        check.classList.toggle("checked", item.done);
        row.classList.toggle("done", item.done);
        updateProgress();
        save();
        if(item.linkedTaskId && window.__DOCKET__ && window.__DOCKET__.setTaskDone){
          window.__DOCKET__.setTaskDone(item.linkedTaskId, item.done);
        }
      });
      row.appendChild(check);
    }

    var contentWrap = document.createElement("div");
    contentWrap.className = "content-wrap";

    var text = document.createElement("input");
    text.className = "item-text";
    text.value = item.text;
    text.spellcheck = false;
    text.addEventListener("input", function(){
      item.text = text.value;
      save();
    });
    contentWrap.appendChild(text);

    if(item.desc){
      var descEl = document.createElement("textarea");
      descEl.className = "item-desc";
      descEl.rows = 1;
      descEl.spellcheck = false;
      descEl.value = item.desc;
      function autoGrowItemDesc(){ descEl.style.height = "auto"; descEl.style.height = descEl.scrollHeight + "px"; }
      descEl.addEventListener("input", function(){
        item.desc = descEl.value;
        save();
        autoGrowItemDesc();
      });
      contentWrap.appendChild(descEl);
      requestAnimationFrame(autoGrowItemDesc);
    }

    var typeToggle = document.createElement("button");
    typeToggle.type = "button";
    typeToggle.className = "item-type-toggle";
    typeToggle.textContent = isYesNo ? "Make this a checkbox" : "Make this Yes / No";
    typeToggle.addEventListener("click", function(){
      item.type = isYesNo ? "checkbox" : "yesno";
      if(item.type === "yesno"){
        item.answer = null;
        item.done = false;
      } else {
        item.answer = null;
      }
      save();
      renderChecklist();
    });
    contentWrap.appendChild(typeToggle);

    row.appendChild(contentWrap);

    var pri = document.createElement("select");
    pri.className = "priority";
    pri.setAttribute("data-pri", item.priority);
    ["H","M","L"].forEach(function(p){
      var opt = document.createElement("option");
      opt.value = p; opt.textContent = p;
      if(p === item.priority) opt.selected = true;
      pri.appendChild(opt);
    });
    pri.addEventListener("change", function(){
      item.priority = pri.value;
      pri.setAttribute("data-pri", item.priority);
      row.setAttribute("data-priority", item.priority);
      applyFilter();
      save();
    });
    row.appendChild(pri);

    if(isYesNo){
      var subBtnSpacer = document.createElement("span");
      subBtnSpacer.style.gridColumn = "5";
      subBtnSpacer.style.gridRow = "1";
      row.appendChild(subBtnSpacer);
    } else {
      var subBtn = document.createElement("button");
      subBtn.type = "button";
      subBtn.className = "sub-btn" + (item.subitems.length ? " has-subs" : "");
      subBtn.textContent = "+";
      subBtn.title = item.subitems.length ? "Add another item to the subsection" : "Create a subsection";
      subBtn.addEventListener("click", function(){
        item.subitems.push(buildSubitem());
        renderChecklist();
        save();
        focusLastSubInput(item.id);
      });
      row.appendChild(subBtn);
    }

    var taskBtn = document.createElement("button");
    taskBtn.type = "button";
    taskBtn.className = "task-btn" + (item.linkedTaskId ? " linked" : "");
    taskBtn.textContent = item.linkedTaskId ? "\u2192 Task" : "+ Task";
    taskBtn.title = item.linkedTaskId ? "Open in Docket" : "Add as a task in Docket, under this checklist's matter";
    taskBtn.addEventListener("click", function(){
      if(!window.__DOCKET__) return;
      if(item.linkedTaskId){
        window.__DOCKET__.openTask(item.linkedTaskId);
        if(window.__activateApp) window.__activateApp("tasks");
        return;
      }
      if(!item.text || !item.text.trim()){ alert("Add item text first."); return; }
      var cs2 = activeChecklist();
      if(!cs2 || !cs2.matterId){
        alert("Link this checklist to a matter first \u2014 use the Matter field above the checklist \u2014 then add items as tasks.");
        return;
      }
      var notesParts = [];
      if(item.desc) notesParts.push(item.desc);
      if(item.notes) notesParts.push(item.notes);
      var sectionLabel = (section.title || "").trim();
      var prefix = sectionLabel && sectionLabel.toLowerCase() !== "checklist" ? sectionLabel + " \u2014 " : "";
      var newId = window.__DOCKET__.addTaskFromChecklistItem({
        matterId: cs2.matterId,
        title: prefix + item.text,
        priority: item.priority,
        notes: notesParts.join("\n\n"),
        done: item.done,
        steps: (item.subitems || []).filter(function(s){ return (s.text||"").trim(); }).map(function(s){ return { text: s.text, done: !!s.done }; }),
        checklistId: cs2.id,
        itemId: item.id
      });
      item.linkedTaskId = newId;
      save();
      renderChecklist();
    });
    row.appendChild(taskBtn);

    var del = document.createElement("button");
    del.type = "button";
    del.className = "del-btn";
    del.innerHTML = "&times;";
    del.title = "Remove item";
    del.addEventListener("click", function(){
      var idx = section.items.indexOf(item);
      if(idx > -1) section.items.splice(idx, 1);
      renderChecklist();
      save();
    });
    row.appendChild(del);

    var notes = document.createElement("input");
    notes.className = "note-line";
    notes.placeholder = "Notes";
    notes.value = item.notes || "";
    notes.addEventListener("input", function(){
      item.notes = notes.value;
      save();
    });
    row.appendChild(notes);

    renderSubsection(item, row);

    return row;
  }

  function sectionTotals(s){
    var total = 0, done = 0;
    s.items.forEach(function(it){
      var t = itemTotals(it);
      total += t.total; done += t.done;
    });
    return { total: total, done: done };
  }

  function updateProgress(){
    var cs = activeChecklist();
    if(!cs) return;
    var totals = checklistTotals(cs);
    progressDoneEl.textContent = totals.done;
    progressTotalEl.textContent = totals.total;
    cs.sections.forEach(function(s, idx){
      var el = sectionsEl.querySelector('[data-section-index="'+idx+'"] .phase-count');
      if(el){
        var t = sectionTotals(s);
        el.textContent = t.done + " / " + t.total;
      }
    });
    renderSidebar();
  }

  function renderSectionLinkRow(section, container){
    container.innerHTML = "";
    if(section.linkedInstructionId){
      // Legacy data from before checklists were restricted to pulling from
      // templates only. Left working so old checklists don't break, but no
      // longer offered as an option for new links (see the "else" branch).
      var linkedDef = instructionDefById(section.linkedInstructionId);
      var status = document.createElement("span");
      if(linkedDef){
        status.innerHTML = "Linked to instructions: <b>" + escapeHtml(linkedDef.title) + "</b>";
      } else {
        status.textContent = "Linked to an instruction topic that no longer exists.";
      }
      container.appendChild(status);

      if(linkedDef){
        var viewBtn = document.createElement("button");
        viewBtn.type = "button";
        viewBtn.className = "link-action";
        viewBtn.textContent = "View";
        viewBtn.addEventListener("click", function(){
          switchToView("instructions");
          state.activeInstructionId = linkedDef.id;
          save();
          renderSidebar();
          renderMain();
          window.scrollTo(0,0);
        });
        container.appendChild(viewBtn);
      }

      var unlinkBtn = document.createElement("button");
      unlinkBtn.type = "button";
      unlinkBtn.className = "link-action danger";
      unlinkBtn.textContent = "Unlink";
      unlinkBtn.addEventListener("click", function(){
        section.linkedInstructionId = null;
        save();
        renderSectionLinkRow(section, container);
        renderSidebar();
      });
      container.appendChild(unlinkBtn);
    } else if(section.linkedTemplateId){
      var linkedTpl = sectionTemplateById(section.linkedTemplateId);
      var statusT = document.createElement("span");
      if(linkedTpl){
        statusT.innerHTML = "Linked to template: <b>" + escapeHtml(linkedTpl.title) + "</b>";
      } else {
        statusT.textContent = "Linked to a template that no longer exists.";
      }
      container.appendChild(statusT);

      if(linkedTpl){
        var viewBtnT = document.createElement("button");
        viewBtnT.type = "button";
        viewBtnT.className = "link-action";
        viewBtnT.textContent = "View";
        viewBtnT.addEventListener("click", function(){
          switchToView("templates");
          state.activeTemplateType = "section";
          state.activeTemplateId = linkedTpl.id;
          save();
          renderSidebar();
          renderMain();
          window.scrollTo(0,0);
        });
        container.appendChild(viewBtnT);
      }

      var unlinkBtnT = document.createElement("button");
      unlinkBtnT.type = "button";
      unlinkBtnT.className = "link-action danger";
      unlinkBtnT.textContent = "Unlink";
      unlinkBtnT.addEventListener("click", function(){
        section.linkedTemplateId = null;
        save();
        renderSectionLinkRow(section, container);
        renderSidebar();
      });
      container.appendChild(unlinkBtnT);
    } else {
      var status2 = document.createElement("span");
      status2.textContent = "Not linked to a template.";
      container.appendChild(status2);

      var linkBtn = document.createElement("button");
      linkBtn.type = "button";
      linkBtn.className = "link-action";
      linkBtn.textContent = "Link…";
      linkBtn.addEventListener("click", function(){
        var sel = document.createElement("select");
        populateTemplateSelect(sel, "section");
        var confirmBtn = document.createElement("button");
        confirmBtn.type = "button";
        confirmBtn.className = "link-action";
        confirmBtn.textContent = "Set link";
        confirmBtn.addEventListener("click", function(){
          if(sel.value){
            section.linkedTemplateId = sel.value;
            var tpl2 = sectionTemplateById(sel.value);
            if(tpl2){
              var copiedItems = tpl2.items.map(buildItemState);
              section.items = section.items.concat(copiedItems);
            }
            save();
            renderChecklist();
            renderSidebar();
          }
        });
        container.innerHTML = "";
        container.appendChild(sel);
        container.appendChild(confirmBtn);
      });
      container.appendChild(linkBtn);
    }
  }

  function escapeHtml(s){
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function renderChecklist(){
    var cs = activeChecklist();
    if(!cs){
      checklistEditorEl.style.display = "none";
      checklistEmptyEl.style.display = "block";
      progressDoneEl.textContent = "0";
      progressTotalEl.textContent = "0";
      return;
    }
    checklistEmptyEl.style.display = "none";
    checklistEditorEl.style.display = "block";

    docTitleEl.textContent = cs.title;

    populateMatterLinkSelect(cs.matterId);
    var linkedMatter = (cs.matterId && window.__DOCKET__) ? window.__DOCKET__.getMatterById(cs.matterId) : null;
    metaClientEl.value = linkedMatter ? linkedMatter.name : cs.meta.client;
    metaCaseNumberEl.value = linkedMatter ? (linkedMatter.number || "") : cs.meta.caseNumber;
    metaClientEl.readOnly = !!linkedMatter;
    metaCaseNumberEl.readOnly = !!linkedMatter;
    metaStaffEl.value = cs.meta.staff;
    metaDateEl.value = cs.meta.date;
    updateMetaVisibility();

    sectionsEl.innerHTML = "";
    cs.sections.forEach(function(section, idx){
      var phase = document.createElement("section");
      phase.className = "phase";
      phase.setAttribute("data-section-index", idx);

      var head = document.createElement("div");
      head.className = "phase-head";

      var title = document.createElement("input");
      title.className = "phase-title";
      title.value = section.title;
      title.addEventListener("input", function(){
        section.title = title.value;
        save();
      });
      head.appendChild(title);

      var count = document.createElement("span");
      count.className = "phase-count";
      var t0 = sectionTotals(section);
      count.textContent = t0.done + " / " + t0.total;
      head.appendChild(count);

      var secDel = document.createElement("button");
      secDel.type = "button";
      secDel.className = "section-del";
      secDel.innerHTML = "&times;";
      secDel.title = "Remove section";
      secDel.addEventListener("click", function(){
        var i = cs.sections.indexOf(section);
        if(i > -1) cs.sections.splice(i, 1);
        renderChecklist();
        save();
      });
      head.appendChild(secDel);

      phase.appendChild(head);

      var sectionLinkRow = document.createElement("div");
      sectionLinkRow.className = "link-row";
      renderSectionLinkRow(section, sectionLinkRow);
      phase.appendChild(sectionLinkRow);

      var rows = document.createElement("div");
      rows.className = "rows";
      section.items.forEach(function(item){
        rows.appendChild(renderRow(section, item));
      });

      var addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "add-item";
      addBtn.textContent = "+ Add item";
      addBtn.addEventListener("click", function(){
        var newItem = { id: uid(), text:"", priority:"M", desc:"", done:false, notes:"", subitems:[], subsectionTitle:"", type:"checkbox", answer:null };
        section.items.push(newItem);
        renderChecklist();
        save();
        var newInput = sectionsEl.querySelector('[data-item-id="'+newItem.id+'"] .item-text');
        if(newInput) newInput.focus();
      });
      rows.appendChild(addBtn);

      phase.appendChild(rows);
      sectionsEl.appendChild(phase);
    });

    var addRowGroup = document.createElement("div");
    addRowGroup.className = "add-row-group";

    var addSectionBtn = document.createElement("button");
    addSectionBtn.type = "button";
    addSectionBtn.className = "add-section";
    addSectionBtn.textContent = "+ Add blank section";
    addSectionBtn.addEventListener("click", function(){
      cs.sections.push({ title: "New section", linkedInstructionId: null, items: [] });
      renderChecklist();
      save();
      var titles = sectionsEl.querySelectorAll(".phase-title");
      if(titles.length){ titles[titles.length-1].focus(); titles[titles.length-1].select(); }
    });
    addRowGroup.appendChild(addSectionBtn);

    if(state.sectionTemplates.length){
      var tplPicker = document.createElement("select");
      tplPicker.className = "tpl-picker";
      populateTemplateSelect(tplPicker, "section");
      tplPicker.addEventListener("change", function(){
        var tmpl = sectionTemplateById(tplPicker.value);
        if(tmpl){
          cs.sections.push({
            title: tmpl.title,
            linkedInstructionId: null,
            items: tmpl.items.map(buildItemState)
          });
          renderChecklist();
          save();
        }
        tplPicker.value = "";
      });
      addRowGroup.appendChild(tplPicker);
    }

    sectionsEl.appendChild(addRowGroup);

    applyFilter();
    updateProgress();
  }

  function renderInstrItemRow(items, it, n){
    var row = document.createElement("div");
    row.className = "instr-item";
    row.addEventListener("dragover", function(e){
      e.preventDefault();
      row.classList.add("drag-over");
    });
    row.addEventListener("dragleave", function(){ row.classList.remove("drag-over"); });
    row.addEventListener("drop", function(e){
      e.preventDefault();
      row.classList.remove("drag-over");
      if(!dragInstrItem || dragInstrItem === it) return;
      var fi = items.indexOf(dragInstrItem), ti = items.indexOf(it);
      if(fi < 0 || ti < 0) return;
      items.splice(fi, 1);
      items.splice(ti, 0, dragInstrItem);
      dragInstrItem = null;
      save();
      renderInstructionEditor();
    });

    var grip = document.createElement("span");
    grip.className = "instr-drag-handle";
    grip.textContent = "⠿";
    grip.title = "Drag to reorder";
    grip.draggable = true;
    grip.addEventListener("dragstart", function(e){
      dragInstrItem = it;
      e.dataTransfer.effectAllowed = "move";
    });
    grip.addEventListener("dragend", function(){ dragInstrItem = null; });
    row.appendChild(grip);

    var num = document.createElement("div");
    num.className = "instr-num";
    num.textContent = (n < 10 ? "0" : "") + n;
    row.appendChild(num);

    var body = document.createElement("div");
    body.className = "instr-body";

    var text = document.createElement("input");
    text.className = "instr-text-input";
    text.placeholder = "Item text";
    text.value = it.text;
    text.spellcheck = false;
    text.addEventListener("input", function(){
      it.text = text.value;
      save();
    });
    body.appendChild(text);

    var desc = document.createElement("textarea");
    desc.className = "instr-desc-input";
    desc.placeholder = "Helper text shown under this item (optional)";
    desc.rows = 1;
    desc.spellcheck = false;
    desc.value = it.desc || "";
    function autoGrowInstrDesc(){ desc.style.height = "auto"; desc.style.height = desc.scrollHeight + "px"; }
    desc.addEventListener("input", function(){
      it.desc = desc.value;
      save();
      autoGrowInstrDesc();
    });
    body.appendChild(desc);
    requestAnimationFrame(autoGrowInstrDesc);

    row.appendChild(body);

    var pri = document.createElement("select");
    pri.className = "instr-pri";
    pri.setAttribute("data-pri", it.priority);
    ["H","M","L"].forEach(function(p){
      var opt = document.createElement("option");
      opt.value = p; opt.textContent = p;
      if(p === it.priority) opt.selected = true;
      pri.appendChild(opt);
    });
    pri.addEventListener("change", function(){
      it.priority = pri.value;
      pri.setAttribute("data-pri", it.priority);
      save();
    });
    row.appendChild(pri);

    var del = document.createElement("button");
    del.type = "button";
    del.className = "instr-item-del";
    del.innerHTML = "&times;";
    del.title = "Remove item";
    del.addEventListener("click", function(){
      var idx = items.indexOf(it);
      if(idx > -1) items.splice(idx, 1);
      renderInstructionEditor();
      renderSidebar();
      save();
    });
    row.appendChild(del);

    return row;
  }

  function renderInstructionEditor(){
    var def = activeInstruction();
    if(!def){
      instructionEditorEl.style.display = "none";
      instructionEmptyEl.style.display = "block";
      return;
    }
    instructionEmptyEl.style.display = "none";
    instructionEditorEl.style.display = "block";

    instructionsViewEl.style.setProperty("--onp-color", colorForInstructionTopic(def));
    populateInstrCategorySelect();
    updateInstrCategorySwatch();
    instrCategoryFormEl.classList.remove("open");

    instrTitleInputEl.value = def.title;

    instrSectionsEl.innerHTML = "";
    def.sections.forEach(function(section){
      var sec = document.createElement("div");
      sec.className = "instr-section";

      var head = document.createElement("div");
      head.className = "instr-section-head";

      var titleInput = document.createElement("input");
      titleInput.className = "instr-title";
      titleInput.placeholder = "Section title";
      titleInput.value = section.title;
      titleInput.addEventListener("input", function(){
        section.title = titleInput.value;
        save();
      });
      head.appendChild(titleInput);

      var secDel = document.createElement("button");
      secDel.type = "button";
      secDel.className = "instr-section-del";
      secDel.innerHTML = "&times;";
      secDel.title = "Remove section";
      secDel.addEventListener("click", function(){
        var idx = def.sections.indexOf(section);
        if(idx > -1) def.sections.splice(idx, 1);
        renderInstructionEditor();
        renderSidebar();
        save();
      });
      head.appendChild(secDel);

      sec.appendChild(head);

      section.items.forEach(function(item, idx){
        sec.appendChild(renderInstrItemRow(section.items, item, idx + 1));
      });

      var addItemBtn = document.createElement("button");
      addItemBtn.type = "button";
      addItemBtn.className = "instr-add-item";
      addItemBtn.textContent = "+ Add item";
      addItemBtn.addEventListener("click", function(){
        section.items.push({ text:"", priority:"M", desc:"" });
        renderInstructionEditor();
        renderSidebar();
        save();
        var inputs = instrSectionsEl.querySelectorAll(".instr-text-input");
        if(inputs.length) inputs[inputs.length-1].focus();
      });
      sec.appendChild(addItemBtn);

      instrSectionsEl.appendChild(sec);
    });

    var addSectionBtn = document.createElement("button");
    addSectionBtn.type = "button";
    addSectionBtn.className = "instr-add-section";
    addSectionBtn.textContent = "+ Add section";
    addSectionBtn.addEventListener("click", function(){
      def.sections.push({ title: "New section", items: [] });
      renderInstructionEditor();
      var titles = instrSectionsEl.querySelectorAll(".instr-title");
      if(titles.length){ titles[titles.length-1].focus(); titles[titles.length-1].select(); }
      save();
    });
    instrSectionsEl.appendChild(addSectionBtn);

    if(!Array.isArray(def.charts)) def.charts = [];
    var chartsWrap = document.createElement("div");
    chartsWrap.className = "instr-charts-wrap";
    var chartsLabel = document.createElement("div");
    chartsLabel.className = "instr-charts-label";
    chartsLabel.textContent = "Charts";
    chartsWrap.appendChild(chartsLabel);
    def.charts.forEach(function(chart){
      chartsWrap.appendChild(renderInstrChart(def, chart));
    });
    var addChartBtn = document.createElement("button");
    addChartBtn.type = "button";
    addChartBtn.className = "instr-add-section";
    addChartBtn.textContent = "+ Add chart";
    addChartBtn.addEventListener("click", function(){
      def.charts.push(buildChart());
      renderInstructionEditor();
      save();
    });
    chartsWrap.appendChild(addChartBtn);
    instrSectionsEl.appendChild(chartsWrap);
  }

  function renderInstrChart(def, chart){
    var wrap = document.createElement("div");
    wrap.className = "instr-chart";

    var head = document.createElement("div");
    head.className = "instr-chart-head";
    var titleInput = document.createElement("input");
    titleInput.className = "instr-chart-title";
    titleInput.placeholder = "Chart title";
    titleInput.value = chart.title || "";
    titleInput.addEventListener("input", function(){ chart.title = titleInput.value; save(); });
    head.appendChild(titleInput);

    var delChartBtn = document.createElement("button");
    delChartBtn.type = "button";
    delChartBtn.className = "instr-section-del";
    delChartBtn.innerHTML = "&times;";
    delChartBtn.title = "Remove chart";
    delChartBtn.addEventListener("click", function(){
      var idx = def.charts.indexOf(chart);
      if(idx > -1) def.charts.splice(idx, 1);
      renderInstructionEditor();
      save();
    });
    head.appendChild(delChartBtn);
    wrap.appendChild(head);

    var table = document.createElement("table");
    table.className = "instr-chart-table";

    var thead = document.createElement("thead");
    var headRow = document.createElement("tr");
    chart.columns.forEach(function(colName, ci){
      var th = document.createElement("th");
      var colInput = document.createElement("input");
      colInput.value = colName;
      colInput.addEventListener("input", function(){ chart.columns[ci] = colInput.value; save(); });
      th.appendChild(colInput);
      var delColBtn = document.createElement("button");
      delColBtn.type = "button";
      delColBtn.className = "instr-chart-del-col";
      delColBtn.innerHTML = "&times;";
      delColBtn.title = "Remove column";
      delColBtn.addEventListener("click", function(){
        chart.columns.splice(ci, 1);
        chart.rows.forEach(function(r){ r.splice(ci, 1); });
        renderInstructionEditor();
        save();
      });
      th.appendChild(delColBtn);
      headRow.appendChild(th);
    });
    var addColTh = document.createElement("th");
    var addColBtn = document.createElement("button");
    addColBtn.type = "button";
    addColBtn.className = "instr-chart-add-col";
    addColBtn.textContent = "+ Col";
    addColBtn.addEventListener("click", function(){
      chart.columns.push("Column " + (chart.columns.length + 1));
      chart.rows.forEach(function(r){ r.push(""); });
      renderInstructionEditor();
      save();
    });
    addColTh.appendChild(addColBtn);
    headRow.appendChild(addColTh);
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    chart.rows.forEach(function(row, ri){
      var tr = document.createElement("tr");
      row.forEach(function(cell, ci){
        var td = document.createElement("td");
        var cellInput = document.createElement("input");
        cellInput.value = cell;
        cellInput.addEventListener("input", function(){ chart.rows[ri][ci] = cellInput.value; save(); });
        td.appendChild(cellInput);
        tr.appendChild(td);
      });
      var delTd = document.createElement("td");
      var delRowBtn = document.createElement("button");
      delRowBtn.type = "button";
      delRowBtn.className = "instr-chart-del-row";
      delRowBtn.innerHTML = "&times;";
      delRowBtn.title = "Remove row";
      delRowBtn.addEventListener("click", function(){
        chart.rows.splice(ri, 1);
        renderInstructionEditor();
        save();
      });
      delTd.appendChild(delRowBtn);
      tr.appendChild(delTd);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);

    var addRowBtn = document.createElement("button");
    addRowBtn.type = "button";
    addRowBtn.className = "instr-chart-add-row";
    addRowBtn.textContent = "+ Add row";
    addRowBtn.addEventListener("click", function(){
      chart.rows.push(chart.columns.map(function(){ return ""; }));
      renderInstructionEditor();
      save();
    });
    wrap.appendChild(addRowBtn);

    return wrap;
  }

  // items: the array `it` lives in (for delete). opts: {hasDesc, hasType, placeholder}
  function renderTplItemRow(items, it, opts){
    opts = opts || {};
    var row = document.createElement("div");
    row.className = "tpl-row";

    var contentWrap = document.createElement("div");
    contentWrap.className = "tpl-content-wrap";

    var text = document.createElement("input");
    text.className = "tpl-text";
    text.placeholder = opts.placeholder || "Item text";
    text.value = it.text;
    text.spellcheck = false;
    text.addEventListener("input", function(){
      it.text = text.value;
      save();
    });
    contentWrap.appendChild(text);

    if(opts.hasDesc){
      var desc = document.createElement("textarea");
      desc.className = "tpl-desc-line";
      desc.placeholder = "Helper text shown under this item (optional)";
      desc.rows = 1;
      desc.spellcheck = false;
      desc.value = it.desc || "";
      function autoGrowTplDesc(){ desc.style.height = "auto"; desc.style.height = desc.scrollHeight + "px"; }
      desc.addEventListener("input", function(){
        it.desc = desc.value;
        save();
        autoGrowTplDesc();
      });
      contentWrap.appendChild(desc);
      requestAnimationFrame(autoGrowTplDesc);
    }

    if(opts.hasType){
      var typeToggle = document.createElement("button");
      typeToggle.type = "button";
      typeToggle.className = "item-type-toggle";
      var isYesNo = it.type === "yesno";
      typeToggle.textContent = isYesNo ? "Make this a checkbox" : "Make this Yes / No";
      typeToggle.addEventListener("click", function(){
        it.type = isYesNo ? "checkbox" : "yesno";
        if(it.type === "yesno" && !Array.isArray(it.subitems)) it.subitems = [];
        save();
        renderTemplateEditor();
      });
      contentWrap.appendChild(typeToggle);
    }

    row.appendChild(contentWrap);

    var pri = document.createElement("select");
    pri.className = "tpl-priority";
    pri.setAttribute("data-pri", it.priority);
    ["H","M","L"].forEach(function(p){
      var opt = document.createElement("option");
      opt.value = p; opt.textContent = p;
      if(p === it.priority) opt.selected = true;
      pri.appendChild(opt);
    });
    pri.addEventListener("change", function(){
      it.priority = pri.value;
      pri.setAttribute("data-pri", it.priority);
      save();
    });
    row.appendChild(pri);

    var del = document.createElement("button");
    del.type = "button";
    del.className = "tpl-del";
    del.innerHTML = "&times;";
    del.title = "Remove item";
    del.addEventListener("click", function(){
      var idx = items.indexOf(it);
      if(idx > -1) items.splice(idx, 1);
      renderTemplateEditor();
      renderSidebar();
      save();
    });
    row.appendChild(del);

    return row;
  }

  // The "if yes" content authored inside a section-template item — mirrors a
  // real checklist's subsection editor, but always visible here (nothing to
  // "answer" yet; this just defines what will show once someone picks Yes).
  function renderTplSubsectionEditor(it){
    var box = document.createElement("div");
    box.className = "subsection";

    var head = document.createElement("div");
    head.className = "subsection-head";

    var titleInput = document.createElement("input");
    titleInput.className = "subsection-title";
    titleInput.placeholder = "If yes…";
    titleInput.value = it.subsectionTitle || "";
    titleInput.addEventListener("input", function(){
      it.subsectionTitle = titleInput.value;
      save();
    });
    head.appendChild(titleInput);

    var count = document.createElement("span");
    count.className = "subsection-count";
    count.textContent = it.subitems.length + (it.subitems.length === 1 ? " item" : " items");
    head.appendChild(count);

    box.appendChild(head);

    var list = document.createElement("div");
    it.subitems.forEach(function(sub){
      list.appendChild(renderTplItemRow(it.subitems, sub, { placeholder: "Follow-up item text" }));
    });
    box.appendChild(list);

    var addBtn = document.createElement("button");
    addBtn.type = "button";
    addBtn.className = "add-sub-item";
    addBtn.textContent = "+ Add follow-up item";
    addBtn.addEventListener("click", function(){
      it.subitems.push({ text:"", priority:"M" });
      renderTemplateEditor();
      save();
    });
    box.appendChild(addBtn);

    return box;
  }

  function renderTplItemEntry(items, it, opts){
    var entry = document.createElement("div");
    entry.className = "tpl-entry";
    entry.appendChild(renderTplItemRow(items, it, opts));
    if(opts.hasType && it.type === "yesno"){
      if(!Array.isArray(it.subitems)) it.subitems = [];
      entry.appendChild(renderTplSubsectionEditor(it));
    }
    return entry;
  }

  function renderTemplateEditor(){
    var active = activeTemplate();
    if(!active){
      templateEditorEl.style.display = "none";
      templateEmptyEl.style.display = "block";
      return;
    }
    templateEmptyEl.style.display = "none";
    templateEditorEl.style.display = "block";

    var tmpl = active.tmpl;
    var isSection = active.type === "section";
    templateTypeLabelEl.textContent = isSection ? "Section template" : "Subsection template";
    templateTitleEl.value = tmpl.title;
    templateTitleEl.placeholder = isSection ? "Section title" : "Subsection title";

    templateCategoryEl.value = tmpl.category || "";
    templateCategoryOptionsEl.innerHTML = "";
    templateCategories(active.type).forEach(function(c){
      var opt = document.createElement("option");
      opt.value = c;
      templateCategoryOptionsEl.appendChild(opt);
    });

    var rowOpts = { hasDesc: isSection, hasType: isSection, placeholder: isSection ? "Item text" : "Follow-up item text" };

    templateItemsWrapEl.innerHTML = "";
    tmpl.items.forEach(function(it){
      templateItemsWrapEl.appendChild(renderTplItemEntry(tmpl.items, it, rowOpts));
    });

    var addBtn = document.createElement("button");
    addBtn.type = "button";
    addBtn.className = "add-item";
    addBtn.textContent = "+ Add item";
    addBtn.addEventListener("click", function(){
      tmpl.items.push(isSection ? { text:"", priority:"M", desc:"", type:"checkbox", subsectionTitle:"", subitems:[] } : { text:"", priority:"M" });
      renderTemplateEditor();
      renderSidebar();
      save();
      var inputs = templateItemsWrapEl.querySelectorAll(".tpl-text");
      if(inputs.length) inputs[inputs.length-1].focus();
    });
    templateItemsWrapEl.appendChild(addBtn);
  }

  templateTitleEl.addEventListener("input", function(){
    var active = activeTemplate();
    if(!active) return;
    active.tmpl.title = templateTitleEl.value;
    save();
    renderSidebar();
  });

  templateCategoryEl.addEventListener("input", function(){
    var active = activeTemplate();
    if(!active) return;
    active.tmpl.category = templateCategoryEl.value;
    save();
    renderSidebar();
  });

  deleteTemplateBtn.addEventListener("click", function(){
    var active = activeTemplate();
    if(!active) return;
    var label = active.type === "section" ? "section template" : "subsection template";
    if(!confirm('Delete "' + active.tmpl.title + '" (' + label + ')? Checklists that already used it keep their own copy of the content — this only removes it from the library.')) return;
    var list = templateListForType(active.type);
    var idx = list.indexOf(active.tmpl);
    if(idx > -1) list.splice(idx, 1);
    state.activeTemplateId = null;
    state.activeTemplateType = null;
    save();
    renderSidebar();
    renderMain();
  });

  function renderMain(){
    checklistViewEl.style.display = "none";
    instructionsViewEl.style.display = "none";
    templatesViewEl.style.display = "none";
    if(state.view === "instructions"){
      instructionsViewEl.style.display = "block";
      renderInstructionEditor();
    } else if(state.view === "templates"){
      templatesViewEl.style.display = "block";
      renderTemplateEditor();
    } else {
      checklistViewEl.style.display = "block";
      renderChecklist();
    }
  }

  // ---- meta field bindings ----
  metaClientEl.addEventListener("input", function(){ activeChecklist().meta.client = metaClientEl.value; save(); renderSidebar(); });
  metaCaseNumberEl.addEventListener("input", function(){ activeChecklist().meta.caseNumber = metaCaseNumberEl.value; save(); });

  function populateMatterLinkSelect(selectedId){
    metaMatterLinkEl.innerHTML = "";
    var none = document.createElement("option");
    none.value = "";
    none.textContent = "\u2014 Not linked \u2014";
    metaMatterLinkEl.appendChild(none);
    var matters = window.__DOCKET__ ? window.__DOCKET__.getMatters() : [];
    matters.forEach(function(m){
      var opt = document.createElement("option");
      opt.value = m.id;
      opt.textContent = m.name + (m.number ? " \u00b7 " + m.number : "");
      if(m.id === selectedId) opt.selected = true;
      metaMatterLinkEl.appendChild(opt);
    });
    var addNew = document.createElement("option");
    addNew.value = "__new__";
    addNew.textContent = "+ New matter\u2026";
    metaMatterLinkEl.appendChild(addNew);
  }
  metaMatterLinkEl.addEventListener("change", function(){
    var cs = activeChecklist();
    if(!cs || !window.__DOCKET__) return;
    if(metaMatterLinkEl.value === "__new__"){
      var name = prompt("New matter name:");
      if(!name || !name.trim()){ renderChecklist(); return; }
      var num = prompt("Matter number (optional):") || "";
      var m = window.__DOCKET__.addMatter(name.trim(), num.trim());
      cs.matterId = m.id;
    } else {
      cs.matterId = metaMatterLinkEl.value || null;
    }
    save();
    renderChecklist();
    renderSidebar();
  });
  metaStaffEl.addEventListener("input", function(){ activeChecklist().meta.staff = metaStaffEl.value; save(); });
  metaDateEl.addEventListener("input", function(){ activeChecklist().meta.date = metaDateEl.value; save(); });

  function updateMetaVisibility(){
    var cs = activeChecklist();
    if(!cs) return;
    var show = cs.showMeta !== false;
    metaGridEl.classList.toggle("hidden", !show);
    metaShowBtn.classList.toggle("visible", !show);
  }
  metaHideBtn.addEventListener("click", function(){
    activeChecklist().showMeta = false;
    save();
    updateMetaVisibility();
  });
  metaShowBtn.addEventListener("click", function(){
    activeChecklist().showMeta = true;
    save();
    updateMetaVisibility();
  });

  docTitleEl.addEventListener("input", function(){
    var cs = activeChecklist();
    if(cs) cs.title = docTitleEl.textContent;
    save();
    renderSidebar();
  });

  // ---- layout ----
  function setLayout(layout){
    state.layout = layout;
    document.querySelectorAll(".seg-opt[data-layout]").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-layout") === layout);
    });
    sectionsEl.classList.toggle("two-col", layout === "two");
    mainWrapEl.classList.toggle("compact", layout === "compact");
    save();
  }
  document.querySelectorAll(".seg-opt[data-layout]").forEach(function(b){
    b.addEventListener("click", function(){ setLayout(b.getAttribute("data-layout")); });
  });

  // ---- priority filter buttons ----
  var priFilterBtns = Array.from(document.querySelectorAll("#priFilters .toggle-chip"));
  priFilterBtns.forEach(function(btn){
    var level = btn.getAttribute("data-pri");
    btn.addEventListener("click", function(){
      state.priorityFilters[level] = !state.priorityFilters[level];
      btn.classList.toggle("active", state.priorityFilters[level]);
      applyFilter();
      save();
    });
  });

  // ---- view toggle ----
  document.querySelectorAll(".view-toggle button[data-view]").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.view = btn.getAttribute("data-view");
      document.querySelectorAll(".view-toggle button[data-view]").forEach(function(b){
        b.classList.toggle("active", b === btn);
      });
      save();
      renderSidebar();
      renderMain();
    });
  });

  // ---- reset (active checklist only) ----
  document.getElementById("resetBtn").addEventListener("click", function(){
    var cs = activeChecklist();
    if(!cs) return;
    if(!confirm('Start a new pass through "' + cs.title + '"? This clears checkmarks, notes, and the fields above for THIS checklist only. Item text and priorities are kept.')) return;
    cs.meta = { client:"", caseNumber:"", staff:"", date:"" };
    cs.sections.forEach(function(s){
      s.items.forEach(function(it){
        it.done = false; it.notes = ""; it.answer = null;
        it.subitems.forEach(function(sub){ sub.done = false; });
      });
    });
    save();
    renderChecklist();
    renderSidebar();
  });

  // ---- delete checklist ----
  deleteChecklistBtn.addEventListener("click", function(){
    var cs = activeChecklist();
    if(!cs) return;
    if(!confirm('Delete "' + cs.title + '"? This removes the checklist entirely, including its notes and progress. This cannot be undone.')) return;
    var idx = state.checklists.indexOf(cs);
    if(idx > -1) state.checklists.splice(idx, 1);
    state.activeChecklistId = state.checklists.length ? state.checklists[0].id : null;
    save();
    renderSidebar();
    renderMain();
  });

  // ---- print ----
  document.getElementById("printBtn").addEventListener("click", function(){
    window.print();
  });

  saveChecklistFileBtn.addEventListener("click", function(){
    var cl = activeChecklist();
    if(cl) exportChecklist(cl);
  });
  loadChecklistFileBtn.addEventListener("click", function(){ loadChecklistFileInput.value = ""; loadChecklistFileInput.click(); });
  loadChecklistFileInput.addEventListener("change", function(){
    var file = loadChecklistFileInput.files && loadChecklistFileInput.files[0];
    if(!file) return;
    readJSONFile(file, function(parsed){
      if(parsed && parsed.__appExport === "trainingChecklistsApp" && parsed.__exportType === "checklist"){
        importChecklist(parsed.checklist);
      } else if(parsed && parsed.__appExport === "trainingChecklistsApp" && parsed.__exportType === "full"){
        alert("That file is a full app backup, not a single checklist. Use \"Load from File\" in the top bar instead.");
      } else {
        alert("That file doesn't look like a saved checklist.");
      }
    }, function(){
      alert("Couldn't read that file — it may not be valid JSON.");
    });
  });

  // ---- rev ----
  var revInput = document.getElementById("revInput");
  revInput.value = state.rev || "1.0";
  revInput.addEventListener("input", function(){ state.rev = revInput.value; save(); });

  // ---- init ----
  priFilterBtns.forEach(function(btn){
    var level = btn.getAttribute("data-pri");
    btn.classList.toggle("active", !!state.priorityFilters[level]);
  });
  setLayout(state.layout || "one");
  document.querySelectorAll(".view-toggle button[data-view]").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-view") === state.view);
  });

  renderSidebar();
  renderMain();

  window.__CHECKLISTS__ = {
    getChecklistsForMatter: function(matterId){
      return state.checklists.filter(function(c){ return c.matterId === matterId; });
    },
    openChecklist: function(id){
      state.activeChecklistId = id;
      switchToView("checklist");
      renderSidebar();
      renderMain();
    },
    setItemDone: function(checklistId, itemId, done){
      var cl = checklistById(state, checklistId);
      if(!cl) return;
      var found = false;
      cl.sections.forEach(function(s){
        s.items.forEach(function(it){
          if(it.id === itemId){ it.done = !!done; found = true; }
        });
      });
      if(found){ save(); renderSidebar(); renderMain(); }
    },
    refresh: function(){ renderSidebar(); renderMain(); }
  };
})();
})();

(function(){
  function activateApp(app){
    document.getElementById("tasksRoot").style.display = app === "tasks" ? "" : "none";
    document.getElementById("checklistsHost").style.display = app === "checklists" ? "block" : "none";
    document.querySelectorAll("#appSwitcher .switch-btn").forEach(b => {
      b.classList.toggle("active", b.getAttribute("data-app") === app);
    });
    if (app === "tasks" && window.__DOCKET__) window.__DOCKET__.refresh();
    if (app === "checklists" && window.__CHECKLISTS__) window.__CHECKLISTS__.refresh();
    try{ localStorage.setItem("docket.activeApp", app); }catch(e){}
  }
  window.__activateApp = activateApp;
  document.querySelectorAll("#appSwitcher .switch-btn").forEach(b => {
    b.addEventListener("click", () => activateApp(b.getAttribute("data-app")));
  });
  let initial = "tasks";
  try{ initial = localStorage.getItem("docket.activeApp") || "tasks"; }catch(e){}
  activateApp(initial);

  // ---- draggable switcher ----
  const switcherEl = document.getElementById("appSwitcher");
  const gripEl = switcherEl.querySelector(".switcher-grip");

  function clampPos(x, y){
    const r = switcherEl.getBoundingClientRect();
    const maxX = window.innerWidth - r.width - 4;
    const maxY = window.innerHeight - r.height - 4;
    return { x: Math.min(Math.max(x, 4), Math.max(maxX, 4)), y: Math.min(Math.max(y, 4), Math.max(maxY, 4)) };
  }
  function placeAt(x, y){
    switcherEl.style.left = x + "px";
    switcherEl.style.top = y + "px";
    switcherEl.style.right = "auto";
    switcherEl.style.transform = "none";
  }
  function savePos(x, y){
    try{ localStorage.setItem("docket.switcherPos", JSON.stringify({ x, y })); }catch(e){}
  }

  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem("docket.switcherPos")); }catch(e){}
  if (saved && typeof saved.x === "number" && typeof saved.y === "number"){
    const p = clampPos(saved.x, saved.y);
    placeAt(p.x, p.y);
  }

  let dragging = false, offX = 0, offY = 0;
  gripEl.addEventListener("pointerdown", e => {
    dragging = true;
    switcherEl.classList.add("dragging");
    const r = switcherEl.getBoundingClientRect();
    offX = e.clientX - r.left;
    offY = e.clientY - r.top;
    gripEl.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  gripEl.addEventListener("pointermove", e => {
    if (!dragging) return;
    const p = clampPos(e.clientX - offX, e.clientY - offY);
    placeAt(p.x, p.y);
  });
  function endDrag(e){
    if (!dragging) return;
    dragging = false;
    switcherEl.classList.remove("dragging");
    const r = switcherEl.getBoundingClientRect();
    savePos(r.left, r.top);
  }
  gripEl.addEventListener("pointerup", endDrag);
  gripEl.addEventListener("pointercancel", endDrag);
  window.addEventListener("resize", () => {
    const r = switcherEl.getBoundingClientRect();
    const p = clampPos(r.left, r.top);
    if (p.x !== r.left || p.y !== r.top) placeAt(p.x, p.y);
  });
})();
</script>
</body>
</html>
