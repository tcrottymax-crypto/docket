<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docket — Attorney Task Manager</title>
<style>
  :root{
    --bg:#f5f5f3; --surface:#ffffff; --surface-2:#fafaf9; --text:#1c1e21; --muted:#6b6f76;
    --border:#e3e3e0; --accent:#4f6f8f; --accent-100:#eaf0f6; --accent-600:#3f5a75; --accent-700:#334a61;
    --selected-bg:#c7ddef; --selected-border:#3f5a75;
    --danger:#b3261e; --danger-100:#fbeae9; --warn:#a8681c; --warn-100:#fbf1e4;
    --ok:#3a7a4e; --radius:6px; --shadow:0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
    --shadow-lg:0 12px 32px rgba(0,0,0,.18);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
  h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;font-weight:600}
  button{font:inherit;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit}
  .app{display:grid;grid-template-columns:240px 1fr 340px;height:100vh;min-height:600px;transition:grid-template-columns .18s ease}
  .app.no-detail{grid-template-columns:240px 1fr 0px}
  .app.no-detail .detail{display:none}
  .sidebar{border-right:1px solid var(--border);background:var(--surface-2);padding:18px 14px;display:flex;flex-direction:column;gap:20px;overflow-y:auto}
  .brand{display:flex;align-items:baseline;gap:8px}
  .brand h1{font-size:21px;letter-spacing:.02em}
  .brand .sub{font-size:11px;color:var(--muted);letter-spacing:.04em}
  .today-date{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-700);font-weight:600}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:var(--radius);padding:7px 12px;font-size:13px}
  .btn:hover{background:var(--accent-100);border-color:var(--accent)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-600);border-color:var(--accent-600)}
  .btn-ghost{border-color:transparent;background:transparent}
  .btn-ghost:hover{background:var(--accent-100)}
  .btn-danger{color:var(--danger)}
  .btn-danger:hover{background:var(--danger-100);border-color:var(--danger)}
  .btn-block{width:100%}
  .btn-sm{padding:4px 8px;font-size:12px}
  .section-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:0 2px}
  .nav-list{display:flex;flex-direction:column;gap:2px}
  .nav-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 8px;border-radius:var(--radius);border:1px solid transparent;background:transparent;color:var(--text)}
  .nav-row:hover{background:var(--accent-100)}
  .nav-row.active{background:var(--selected-bg);border-color:var(--selected-border);font-weight:600}
  .nav-row .count{margin-left:auto;font-size:11px;color:var(--muted);background:var(--surface);border-radius:10px;padding:1px 7px}
  .nav-row.overdue .count{color:var(--danger);background:var(--danger-100)}
  .matter-row{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:var(--radius);border:1px solid transparent;background:transparent}
  .matter-row:hover{background:var(--accent-100)}
  .matter-row.active{background:var(--selected-bg);border-color:var(--selected-border)}
  .matter-row .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
  .matter-row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left;background:none;border:0;padding:0;color:inherit}
  .matter-row .count{font-size:11px;color:var(--muted)}
  .matter-row .del{opacity:0;font-size:12px;color:var(--muted);border:0;background:none;padding:0 2px}
  .matter-row:hover .del{opacity:1}
  .matter-row .del:hover{color:var(--danger)}
  .matter-row .edit{opacity:0;font-size:11px;color:var(--muted);border:0;background:none;padding:0 2px}
  .matter-row:hover .edit{opacity:1}
  .matter-row .edit:hover{color:var(--accent-700)}
  .matter-row .sub-label{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px}
  .matter-group{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
  .matter-group-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-700);font-weight:700;padding:6px 2px 2px}
  .matter-subgroup-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:3px 2px 1px 14px}
  .group-toggle{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;font-family:inherit}
  .group-toggle:hover{color:var(--accent)}
  .matters-head{display:flex;align-items:baseline;gap:8px}
  .matters-head .manage-link{margin-left:auto;font-size:10px;color:var(--accent-700);border:0;background:none;text-decoration:underline;padding:0}
  .group-by-sel{margin-left:auto;font-size:10px;border:1px solid var(--border);border-radius:8px;padding:2px 4px;background:var(--surface);color:var(--muted)}
  .manage-row{display:flex;gap:10px;padding:2px 2px 6px}
  .manage-row .manage-link{font-size:10px;color:var(--accent-700);border:0;background:none;text-decoration:underline;padding:0}
  .caseTypeRow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--border)}
  .caseTypeRow input{flex:1;border:1px solid var(--border);border-radius:var(--radius);padding:4px 6px;font-size:13px;background:var(--surface-2)}
  .subtypeRow{display:flex;align-items:center;gap:6px;padding:3px 0 3px 18px}
  .subtypeRow input{flex:1;border:1px solid var(--border);border-radius:var(--radius);padding:3px 6px;font-size:12px;background:var(--surface-2)}
  .case-type-block{border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;margin-bottom:8px}
  .add-matter{display:flex;gap:6px}
  .add-matter input{flex:1;min-width:0;border:1px solid var(--border);border-radius:var(--radius);padding:5px 7px;font-size:12px;background:var(--surface)}
  .sidebar-footer{margin-top:auto;display:flex;flex-direction:column;gap:6px}
  .more-menu{display:flex;flex-direction:column;gap:6px;margin-top:6px;padding-top:10px;border-top:1px solid var(--border)}
  .main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
  .main-head{padding:18px 24px 12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:12px}
  .main-head-top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .main-head h2{font-size:26px}
  .main-head-top .controls{margin-left:auto;display:flex;gap:8px;align-items:center}
  .search{border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;font-size:13px;width:210px;background:var(--surface)}
  .progress-row{display:flex;align-items:center;gap:10px}
  .progress-track{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
  .progress-fill{height:100%;background:var(--accent)}
  .progress-label{font-size:11px;color:var(--muted);white-space:nowrap}
  .list{flex:1;overflow-y:auto;padding:6px 24px 0}
  .task{display:flex;flex-direction:column}
  .task-row{display:flex;align-items:flex-start;gap:11px;padding:11px 8px;border-bottom:1px solid var(--border);cursor:pointer;border-left:3px solid transparent}
  .task-row:hover{background:var(--surface)}
  .edit-hint{opacity:0;border:1px solid var(--border);background:var(--surface);color:var(--accent-700);font-size:11px;padding:3px 8px;border-radius:10px;white-space:nowrap}
  .task-row:hover .edit-hint{opacity:1}
  .edit-hint:hover{background:var(--accent-100);border-color:var(--accent)}
  .task-row.selected{background:var(--selected-bg);border-left-color:var(--selected-border)}
  .task-row.done{opacity:.5}
  .checkbox{width:19px;height:19px;flex:none;border:1.5px solid var(--muted);border-radius:4px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0;margin-top:1px}
  .checkbox.checked{background:var(--accent);border-color:var(--accent)}
  .checkbox.checked::after{content:"";display:block;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .task-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .task-title{font-size:14.5px;line-height:1.35}
  .task-title.done{text-decoration:line-through}
  .task-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
  .meta-matter{color:var(--accent-700);font-weight:600}
  .meta-due{padding:1px 6px;border-radius:3px}
  .meta-due.overdue{color:var(--danger);background:var(--danger-100);font-weight:600}
  .meta-due.today{color:var(--accent-700);font-weight:600}
  .tag{display:inline-flex;align-items:center;font-size:10.5px;letter-spacing:.02em;padding:2px 8px;border-radius:10px;white-space:nowrap}
  .tag-p1{background:var(--danger-100);color:var(--danger)}
  .tag-p2{background:var(--warn-100);color:var(--warn)}
  .tag-p3{background:var(--border);color:var(--muted)}
  .tag-cat{border:1px solid var(--border);color:var(--muted)}
  .task-right{display:flex;align-items:center;gap:6px;margin-left:auto}
  .chev{font-size:15px;color:var(--muted);transform:rotate(0deg)}
  .chev.open{transform:rotate(90deg)}
  .steps-preview{padding:2px 0 16px 38px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--border)}
  .step-line{display:flex;align-items:center;gap:9px;font-size:13px}
  .step-line .checkbox{width:15px;height:15px}
  .step-line .checkbox.checked::after{width:4px;height:7px}
  .step-line .txt.done{text-decoration:line-through;opacity:.55}
  .empty-state{padding:60px 10px;text-align:center;color:var(--muted);font-size:13.5px}
  .composer{border-top:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:10px;background:var(--surface)}
  .composer input{flex:1;border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;font-size:14px;background:var(--surface-2)}
  .composer .hint{font-size:10.5px;color:var(--muted);white-space:nowrap}
  .detail{border-left:1px solid var(--border);background:var(--surface);overflow-y:auto;display:flex;flex-direction:column}
  .detail-empty{padding:40px 22px;color:var(--muted);font-size:13.5px;line-height:1.6}
  .detail-body{padding:18px 20px 30px;display:flex;flex-direction:column;gap:16px}
  .detail-head{display:flex;align-items:center;gap:8px}
  .detail-head .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-700);font-weight:600}
  .detail-title{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:21px;line-height:1.2;border:0;border-bottom:1px solid var(--border);padding:0 0 8px;width:100%;background:transparent;resize:none}
  .field-grid{display:grid;grid-template-columns:82px 1fr;row-gap:10px;column-gap:10px;font-size:13px;align-items:center}
  .field-grid label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .field-grid select,.field-grid input[type=date],.field-grid input[type=time]{border:1px solid var(--border);border-radius:var(--radius);padding:5px 7px;background:var(--surface-2);width:100%}
  .pillrow{display:flex;gap:6px;flex-wrap:wrap}
  .pill{border:1px solid var(--border);background:transparent;border-radius:14px;padding:4px 11px;font-size:12px}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .pill.p1.active{background:var(--danger);border-color:var(--danger)}
  .pill.p2.active{background:var(--warn);border-color:var(--warn)}
  .steps-block{display:flex;flex-direction:column;gap:8px}
  .steps-block .step-line .del{margin-left:auto;opacity:0;border:0;background:none;color:var(--muted);font-size:13px}
  .steps-block .step-line:hover .del{opacity:1}
  .steps-block .step-line:hover .del:hover{color:var(--danger)}
  .add-step{border:1px dashed var(--border);border-radius:var(--radius);padding:6px 9px;font-size:13px;background:var(--surface-2)}
  .notes{width:100%;border:1px solid var(--border);border-radius:var(--radius);padding:9px;font-size:13px;line-height:1.55;background:var(--surface-2);resize:vertical;min-height:80px}
  .detail-actions{display:flex;gap:8px;flex-wrap:wrap}
  .detail-actions .btn{flex:1}
  .icon-btn{border:0;background:none;color:var(--muted);padding:2px 4px}
  .icon-btn:hover{color:var(--text)}
  #importFile,#checklistFile{display:none}
  #appSwitcher{position:fixed;bottom:16px;right:16px;z-index:500;display:flex;align-items:center;border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow-lg);touch-action:none}
  #appSwitcher .switcher-grip{cursor:grab;padding:0 6px 0 10px;font-size:12px;line-height:1;color:var(--muted);user-select:none;display:flex;align-items:center;align-self:stretch}
  #appSwitcher .switcher-grip:active{cursor:grabbing}
  #appSwitcher.dragging{box-shadow:var(--shadow-lg),0 0 0 2px var(--accent);transition:none}
  #appSwitcher .switch-btn{border:0;background:transparent;padding:7px 16px 7px 6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer}
  #appSwitcher .switch-btn:first-of-type{padding-left:10px}
  #appSwitcher .switch-btn.active{background:var(--selected-bg);color:var(--text)}
  #checklistsHost{display:none}
  .matter-row .cl-badge{font-size:10px;font-weight:600;color:var(--accent-700);background:var(--accent-100);border-radius:8px;padding:2px 7px;border:0;cursor:pointer;flex:none}
  .matter-row .cl-badge:hover{background:var(--accent);color:#fff}
  @media print{ #appSwitcher{display:none !important} }
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,20,22,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal{width:min(440px,100%);background:var(--surface);border-radius:8px;box-shadow:var(--shadow-lg);padding:22px;display:flex;flex-direction:column;gap:14px}
  .modal h3{font-size:19px}
  .modal .field{display:flex;flex-direction:column;gap:5px}
  .modal .field label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .modal select,.modal input[type=text]{border:1px solid var(--border);border-radius:var(--radius);padding:7px 9px;background:var(--surface-2);width:100%;font-size:13.5px}
  .modal .summary{font-size:12.5px;color:var(--muted);line-height:1.5;background:var(--surface-2);border-radius:var(--radius);padding:9px 11px}
  .modal .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
  .modal .hint-block{font-size:12px;color:var(--muted);line-height:1.5;background:var(--surface-2);border-radius:var(--radius);padding:9px 11px}
  .cal-status{font-size:11.5px;color:var(--muted);line-height:1.4;padding:2px 2px 0}
  .cal-status b{color:var(--text);font-weight:600}
  .cal-row{display:flex;gap:6px}
  .cal-row .btn{flex:1}
  @media (max-width:900px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
    .app.no-detail{grid-template-columns:1fr}
    .sidebar{display:none}
    .detail{position:fixed;inset:0;z-index:20;border-left:0}
    .detail-empty{display:none}
    .edit-hint{opacity:1}
  }
  @media (hover:none){
    .edit-hint{opacity:1}
  }
  @media print{
    .sidebar,.composer,.detail,.main-head-top .controls,.search{display:none !important}
    .app{display:block;height:auto}
    .main-head{border:0}
    .task-right,.chev{display:none !important}
    body{background:#fff}
  }
</style>
</head>
<body>
<div id="appSwitcher">
  <span class="switcher-grip" title="Drag to move">&#8942;&#8942;</span>
  <button type="button" class="switch-btn active" data-app="tasks">Tasks</button>
  <button type="button" class="switch-btn" data-app="checklists">Checklists</button>
</div>

<div id="tasksRoot">
<div class="app" id="app"></div>
</div>

<template id="checklistsTemplate"><style>
  :host{
    --color-bg:#f5f5f3;
    --color-surface:#ffffff;
    --color-surface-2:#fafaf9;
    --color-text:#1c1e21;
    --color-text-muted:#6b6f76;
    --color-accent:#4f6f8f;
    --color-accent-600:#3f5a75;
    --color-accent-700:#334a61;
    --color-accent-800:#263c4f;
    --color-selected-bg:#c7ddef;
    --color-selected-border:#3f5a75;
    --color-divider:rgba(29,31,32,.16);
    --color-divider-strong:rgba(29,31,32,.30);
    --n-100:#f5f5f8; --n-200:#e7e7ea; --n-300:#d4d4d7; --n-400:#b7b7ba;
    --n-500:#98989b; --n-600:#7a7a7d; --n-700:#5d5d60; --n-800:#424244; --n-900:#2b2b2d;
    --font-heading:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-display:Georgia,"Times New Roman",serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --radius-xs:3px;
    --radius-sm:5px;
    --radius-md:6px;
    --radius-lg:8px;
    --radius-full:999px;
    --shadow-sm:0 1px 2px rgba(29,31,32,.07);
    --shadow-md:0 4px 16px rgba(29,31,32,.09);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:15px;line-height:1.45;}
  button,input,select{font-family:inherit;}
  button{transition:background-color .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease,transform .1s ease;}

  /* ---- topbar ---- */
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px;background:var(--color-bg);border-bottom:2px solid var(--color-text);flex-wrap:wrap;}
  .brand{display:flex;flex-direction:column;line-height:1.15;}
  .brand-name{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.1px;}
  .brand-sub{font-family:var(--font-heading);font-size:11px;color:var(--n-600);letter-spacing:.05em;text-transform:uppercase;display:flex;gap:4px;}
  .brand-sub input{width:34px;border:none;background:transparent;font:inherit;color:inherit;}
  .topbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .view-toggle{display:inline-flex;border:1px solid var(--color-divider-strong);border-radius:var(--radius-sm);overflow:hidden;}
  .view-toggle button{padding:7px 16px;font-family:var(--font-heading);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;border:none;border-right:1px solid var(--color-divider-strong);background:transparent;color:var(--color-text);cursor:pointer;}
  .view-toggle button:last-child{border-right:none;}
  .view-toggle button.active{background:var(--color-selected-bg);color:var(--color-text);}
  .btn{font-family:var(--font-heading);font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:8px 16px;border:1px solid var(--n-400);border-radius:var(--radius-sm);background:transparent;color:var(--color-text);cursor:pointer;}
  .btn-primary{background:var(--color-accent);border-color:var(--color-accent);color:#fff;box-shadow:var(--shadow-sm);}
  .btn:hover{filter:brightness(0.96);}
  .btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:var(--shadow-md);}
  .btn:active{transform:translateY(0);}

  /* ---- shell ---- */
  .shell{display:flex;align-items:flex-start;min-height:calc(100vh - 54px);}
  .sidebar{width:288px;flex-shrink:0;border-right:1px solid var(--color-divider);padding:16px 14px;position:sticky;top:54px;max-height:calc(100vh - 54px);overflow-y:auto;}
  .search-input{width:100%;padding:8px 12px;border:1px solid var(--color-divider-strong);border-radius:var(--radius-sm);background:var(--color-surface);font-size:13px;color:var(--color-text);margin-bottom:16px;}
  .search-input::placeholder{color:var(--n-500);}
  .nav-group{margin-bottom:16px;}
  .nav-cat-label{font-family:var(--font-heading);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--n-600);padding:0 6px 6px;}
  .nav-type-label{font-family:var(--font-heading);font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--color-accent-700);padding:0 6px 6px;border-bottom:1px solid var(--color-divider);margin-bottom:8px;}
  .nav-subcat-label{font-family:var(--font-heading);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--n-500);padding:6px 6px 4px 10px;display:flex;align-items:center;}
  .nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:8px 10px;border:none;border-radius:var(--radius-xs);background:transparent;font-size:13px;color:var(--color-text);cursor:pointer;line-height:1.3;margin-bottom:1px;}
  .nav-item.nested{padding-left:20px;}
  .nav-item:hover{background:color-mix(in srgb, var(--color-text) 6%, transparent);}
  .nav-item.active{background:var(--color-selected-bg);color:var(--color-text);}
  .nav-count{font-family:var(--font-heading);font-size:10.5px;color:var(--n-500);white-space:nowrap;flex-shrink:0;}
  .nav-item.active .nav-count{color:var(--color-text-muted);}
  .nav-item.hidden{display:none;}
  .nav-empty{font-size:12px;color:var(--n-500);padding:6px 8px 14px;font-style:italic;line-height:1.5;}
  .nav-link-dot{width:7px;height:7px;border-radius:50%;background:var(--color-accent-600);display:inline-block;margin-right:6px;flex-shrink:0;}
  .btn-block{width:100%;margin-bottom:12px;}

  .new-checklist-form{display:none;border:1px solid var(--color-divider-strong);border-radius:var(--radius-md);background:var(--color-surface);padding:14px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
  .new-checklist-form.open{display:block;}
  .new-checklist-form label{display:block;font-family:var(--font-heading);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--n-700);margin-bottom:10px;}
  .new-checklist-form input[type="text"], .new-checklist-form input:not([type]), .new-checklist-form select{width:100%;margin-top:4px;padding:7px 9px;border:1px solid var(--color-divider-strong);border-radius:var(--radius-xs);background:var(--color-bg);font-family:var(--font-body);font-size:13px;color:var(--color-text);text-transform:none;letter-spacing:normal;font-weight:400;}
  .new-checklist-form .nc-copy-row{display:flex;align-items:center;gap:7px;text-transform:none;letter-spacing:normal;font-weight:400;font-size:12px;color:var(--n-700);}
  .new-checklist-form .nc-copy-row input{margin-top:0;width:auto;}
  .new-checklist-form .nc-copy-row span{font-family:var(--font-body);}
  .nc-actions{display:flex;gap:8px;margin-top:2px;}
  .nc-actions .btn{flex:1;}

  .main-wrap{flex:1;min-width:0;padding:30px 26px 80px;}
  .main-inner{max-width:920px;margin:0 auto;}

  /* ---- checklist header ---- */
  .title-row{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;border-bottom:2px solid var(--color-text);padding-bottom:14px;margin-bottom:18px;}
  h1.doc-title{font-family:var(--font-display);font-size:32px;font-weight:700;letter-spacing:-0.3px;border:none;background:transparent;color:var(--color-text);width:100%;max-width:600px;}
  h1.doc-title:focus{outline:none;border-bottom:1px solid var(--color-accent);}
  .progress-badge{font-family:var(--font-heading);font-size:15px;font-weight:600;white-space:nowrap;}
  .progress-badge b{color:var(--color-accent-700);font-size:19px;}

  .link-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--n-600);padding:6px 0 10px;border-bottom:1px dotted var(--color-divider);margin-bottom:6px;}
  .link-row .link-action{font-family:var(--font-heading);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--color-accent-700);background:transparent;border:none;cursor:pointer;padding:2px 0;}
  .link-row .link-action:hover{text-decoration:underline;}
  .link-row .link-action.danger:hover{color:#a33b3b;}
  .link-row select{font-size:11.5px;padding:4px 8px;border:1px solid var(--color-divider-strong);border-radius:var(--radius-xs);background:var(--color-surface);color:var(--color-text);}

  .checklist-empty{display:none;max-width:560px;margin:60px auto 0;text-align:center;}
  .checklist-empty h2{font-family:var(--font-heading);font-size:22px;font-weight:700;margin-bottom:12px;}
  .checklist-empty p{font-size:13.5px;color:var(--n-600);line-height:1.6;}

  #metaSection{margin-bottom:20px;}
  .meta-grid{display:grid;grid-template-columns:repeat(5,1fr) auto;align-items:end;gap:18px;}
  .meta-grid.hidden{display:none;}
  .meta-field label{display:block;font-family:var(--font-heading);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--n-700);margin-bottom:4px;}
  .meta-field input{width:100%;border:none;border-bottom:1px solid var(--color-divider-strong);background:transparent;padding:5px 2px;font-size:14px;color:var(--color-text);}
  .meta-field input:focus{outline:none;border-bottom-color:var(--color-accent);}
  .meta-field input::placeholder{color:var(--n-400);}
  .meta-field select{width:100%;border:none;border-bottom:1px solid var(--color-divider-strong);background:transparent;padding:5px 2px;font-size:14px;color:var(--color-text);font-family:inherit;}
  .meta-field select:focus{outline:none;border-bottom-color:var(--color-accent);}
  .meta-hide-link, .meta-add-link{font-family:var(--font-heading);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--n-500);background:transparent;border:none;cursor:pointer;padding:5px 0;white-space:nowrap;}
  .meta-hide-link:hover, .meta-add-link:hover{color:var(--color-accent-700);text-decoration:underline;}
  .meta-add-link{display:none;}
  .meta-add-link.visible{display:inline-block;}

  .toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--color-divider);}
  .toolbar-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tb-label{font-family:var(--font-heading);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--n-600);margin-right:2px;}
  .seg{display:inline-flex;border:1px solid var(--n-400);border-radius:var(--radius-sm);overflow:hidden;}
  .seg-opt{font-family:var(--font-heading);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:6px 13px;border:none;border-right:1px solid var(--n-400);background:transparent;color:var(--color-text);cursor:pointer;}
  .seg-opt:last-child{border-right:none;}
  .seg-opt.active{background:var(--color-selected-bg);color:var(--color-text);}
  .pri-filters{display:inline-flex;gap:6px;flex-wrap:wrap;}
  .toggle-chip{font-family:var(--font-heading);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:6px 14px;border:1px solid var(--n-400);border-radius:var(--radius-full);background:transparent;color:var(--color-text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .toggle-chip .dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--n-500);display:inline-block;}
  .toggle-chip[data-pri="H"] .dot{border-color:var(--color-accent-700);}
  .toggle-chip[data-pri="M"] .dot{border-color:var(--color-accent-600);}
  .toggle-chip[data-pri="L"] .dot{border-color:var(--n-400);}
  .toggle-chip.active{border-color:var(--color-accent-700);color:var(--color-accent-700);background:color-mix(in srgb, var(--color-accent-700) 8%, transparent);}
  .toggle-chip.active .dot{background:var(--color-accent-700);border-color:var(--color-accent-700);}

  /* ---- sections ---- */
  #sections{display:grid;grid-template-columns:1fr;gap:22px;}
  #sections.two-col{grid-template-columns:1fr 1fr;align-items:start;}
  .phase{border:1px solid var(--color-divider);border-radius:var(--radius-lg);background:var(--color-surface);padding:18px 20px 8px;box-shadow:var(--shadow-sm);}

  .phase-head{display:flex;align-items:baseline;gap:12px;padding-bottom:9px;border-bottom:1px solid var(--color-text);margin-bottom:6px;}
  .phase-title{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:.01em;text-transform:uppercase;flex:1;border:none;background:transparent;color:var(--color-text);}
  .phase-title:focus{outline:none;border-bottom:1px solid var(--color-accent);}
  .phase-count{font-family:var(--font-heading);font-size:12px;letter-spacing:.05em;color:var(--n-600);white-space:nowrap;}
  .add-section{margin-top:4px;font-family:var(--font-heading);font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--color-accent-700);background:transparent;border:1.5px dashed var(--n-400);border-radius:var(--radius-sm);cursor:pointer;padding:10px 14px;width:100%;text-align:center;}
  .add-section:hover{border-color:var(--color-accent-700);background:color-mix(in srgb, var(--color-accent-700) 5%, transparent);}

  .rows{padding:2px 0 12px;}
  .row{display:grid;grid-template-columns:20px 1fr 44px 26px 22px 22px;gap:0 10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--color-divider);}
  .row:last-child{border-bottom:none;}
  .row.hidden{display:none;}
  .row.done .item-text{color:var(--n-600);text-decoration:line-through;text-decoration-color:var(--n-400);}

  .check{grid-column:1;grid-row:1;width:20px;height:20px;border-radius:var(--radius-full);border:1.5px solid var(--n-500);background:transparent;cursor:pointer;position:relative;flex-shrink:0;margin-top:1px;}
  .check.checked{background:var(--color-accent-700);border-color:var(--color-accent-700);}
  .check.checked::after{content:"";position:absolute;left:4px;top:2px;width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg);}

  .row.type-yesno{grid-template-columns:48px 1fr 44px 22px 22px;}
  .yn-toggle{grid-column:1;grid-row:1;display:flex;gap:3px;margin-top:1px;}
  .yn-btn{width:21px;height:20px;padding:0;border-radius:var(--radius-full);font-family:var(--font-heading);font-size:10.5px;font-weight:700;letter-spacing:.02em;border:1.5px solid var(--n-500);background:transparent;color:var(--n-700);cursor:pointer;line-height:1;}
  .yn-btn.yes.active{background:var(--color-accent-700);border-color:var(--color-accent-700);color:#fff;}
  .yn-btn.no.active{background:var(--n-600);border-color:var(--n-600);color:#fff;}

  .content-wrap{grid-column:2;grid-row:1;min-width:0;}
  .item-text{border:none;background:transparent;font:inherit;font-size:14.5px;color:var(--color-text);width:100%;padding:1px 0;}
  .item-text:focus{outline:none;border-bottom:1px solid var(--color-accent);}
  .item-desc{display:block;width:100%;border:none;border-bottom:1px dotted transparent;background:transparent;font-family:inherit;font-size:12.5px;color:var(--n-600);font-style:italic;line-height:1.4;margin-top:3px;padding:0 0 2px;resize:none;overflow:hidden;}
  .item-desc:hover{border-bottom-color:var(--color-divider);}
  .item-desc:focus{outline:none;border-bottom-color:var(--color-accent);}
  .item-type-toggle{display:block;font-family:var(--font-heading);font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--n-400);background:transparent;border:none;cursor:pointer;padding:3px 0 0;}
  .item-type-toggle:hover{color:var(--color-accent-700);text-decoration:underline;}

  .priority{grid-column:3;grid-row:1;width:42px;text-align:center;font-family:var(--font-heading);font-size:11.5px;font-weight:600;letter-spacing:.03em;border-radius:var(--radius-full);padding:3px 0;cursor:pointer;align-self:start;margin-top:1px;}
  .priority[data-pri="H"]{background:var(--color-accent-700);color:#fff;border:1px solid var(--color-accent-700);}
  .priority[data-pri="M"]{background:transparent;color:var(--color-accent-800);border:1px solid var(--color-accent-600);}
  .priority[data-pri="L"]{background:transparent;color:var(--n-700);border:1px solid var(--n-400);}

  .sub-btn{grid-column:5;grid-row:1;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:50%;background:transparent;color:var(--n-400);font-size:15px;line-height:1;cursor:pointer;padding:0;margin-top:1px;}
  .sub-btn:hover{color:var(--color-accent-700);background:color-mix(in srgb, var(--color-accent-700) 10%, transparent);}
  .sub-btn.has-subs{color:var(--color-accent-700);}

  .note-line{grid-column:2 / span 5;grid-row:2;border:none;border-bottom:1px dotted var(--color-divider);background:transparent;font:inherit;font-size:12.5px;color:var(--n-700);padding:5px 0 3px;margin-top:4px;width:100%;}
  .note-line::placeholder{color:var(--n-400);}
  .note-line:focus{outline:none;border-bottom:1px solid var(--color-accent);}

  .subsection{grid-column:1 / -1;grid-row:3;margin:6px 0 2px 32px;border:1px solid var(--color-divider);border-radius:var(--radius-md);background:var(--color-surface-2);padding:10px 14px 12px;}
  .subsection-head{display:flex;align-items:baseline;gap:10px;padding-bottom:6px;margin-bottom:2px;border-bottom:1px solid var(--color-divider-strong);}
  .subsection-title{flex:1;min-width:0;border:none;background:transparent;font-family:var(--font-heading);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--color-text);padding:2px 0;}
  .subsection-title:focus{outline:none;border-bottom:1px solid var(--color-accent);}
  .subsection-title::placeholder{color:var(--n-500);}
  .subsection-count{font-family:var(--font-heading);font-size:10.5px;color:var(--n-600);white-space:nowrap;}

  .sub-row{display:grid;grid-template-columns:16px 1fr 34px 18px;gap:0 8px;align-items:start;padding:7px 0;border-bottom:1px solid var(--color-divider);}
  .sub-row:last-child{border-bottom:none;}
  .sub-row.hidden{display:none;}
  .sub-check{grid-column:1;grid-row:1;width:16px;height:16px;border-radius:var(--radius-full);border:1px solid var(--n-500);background:transparent;cursor:pointer;position:relative;flex-shrink:0;margin-top:1px;}
  .sub-check.checked{background:var(--color-accent-600);border-color:var(--color-accent-600);}
  .sub-check.checked::after{content:"";position:absolute;left:3px;top:1px;width:7px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg);}
  .sub-text{grid-column:2;grid-row:1;border:none;background:transparent;font:inherit;font-size:13px;color:var(--color-text);width:100%;padding:1px 0;}
  .sub-text:focus{outline:none;border-bottom:1px solid var(--color-accent);}
  .sub-row.done .sub-text{color:var(--n-600);text-decoration:line-through;text-decoration-color:var(--n-400);}
  .sub-priority{grid-column:3;grid-row:1;width:32px;text-align:center;font-family:var(--font-heading);font-size:10.5px;font-weight:600;letter-spacing:.02em;border-radius:var(--radius-full);padding:2px 0;cursor:pointer;align-self:start;margin-top:1px;}
  .sub-priority[data-pri="H"]{background:var(--color-accent-700);color:#fff;border:1px solid var(--color-accent-700);}
  .sub-priority[data-pri="M"]{background:transparent;color:var(--color-accent-800);border:1px solid var(--color-accent-600);}
  .sub-priority[data-pri="L"]{background:transparent;color:var(--n-700);border:1px solid var(--n-400);}
  .sub-note-line{grid-column:2 / span 2;grid-row:2;border:none;border-bottom:1px dotted var(--color-divider);background:transparent;font:inherit;font-size:11.5px;color:var(--n-700);padding:4px 0 2px;margin-top:2px;width:100%;}
  .sub-note-line::placeholder{color:var(--n-400);}
  .sub-note-line:focus{outline:none;border-bottom:1px solid var(--color-accent);}
  .add-sub-item{margin-top:4px;font-family:var(--font-heading);font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--color-accent-600);background:transparent;border:none;cursor:pointer;padding:3px 0;}
  .add-sub-item:hover{text-decoration:underline;}

  .add-item{margin:6px 0 8px;font-family:var(--font-heading);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--color-accent-700);background:transparent;border:none;cursor:pointer;padding:4px 0;}
  .add-item:hover{text-decoration:underline;}

  .tpl-picker{font-family:var(--font-heading);font-size:11px;padding:5px 8px;border:1px solid var(--color-divider-strong);border-radius:var(--radius-xs);background:var(--color-surface);color:var(--n-700);text-transform:none;letter-spacing:normal;}
  .add-row-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 8px;}
  .add-row-group .add-item, .add-row-group .add-sub-item{margin:0;}

  /* ---- template editor rows (standard sections / subsections library) ---- */
  .tpl-entry{margin-bottom:2px;}
  .tpl-row{display:grid;grid-template-columns:1fr 44px 22px;gap:0 10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--color-divider);}
  .tpl-entry:last-child > .tpl-row{border-bottom:none;}
  .tpl-content-wrap{grid-column:1;min-width:0;}
  .tpl-text{display:block;border:none;background:transparent;font:inherit;font-size:14.5px;color:var(--color-text);width:100%;padding:1px 0;}
  .tpl-text:focus{outline:none;border-bottom:1px solid var(--color-accent);}
  .tpl-desc-line{display:block;border:none;border-bottom:1px dotted var(--color-divider);background:transparent;font:inherit;font-size:12.5px;line-height:1.5;color:var(--n-700);padding:4px 0 2px;margin-top:3px;width:100%;resize:none;overflow:hidden;}
  .tpl-desc-line::placeholder{color:var(--n-400);}
  .tpl-desc-line:focus{outline:none;border-bottom:1px solid var(--color-accent);}
  .tpl-priority{grid-column:2;width:42px;text-align:center;font-family:var(--font-heading);font-size:11.5px;font-weight:600;letter-spacing:.03em;border-radius:var(--radius-full);padding:3px 0;cursor:pointer;align-self:start;margin-top:1px;}
  .tpl-priority[data-pri="H"]{background:var(--color-accent-700);color:#fff;border:1px solid var(--color-accent-700);}
  .tpl-priority[data-pri="M"]{background:transparent;color:var(--color-accent-800);border:1px solid var(--color-accent-600);}
  .tpl-priority[data-pri="L"]{background:transparent;color:var(--n-700);border:1px solid var(--n-400);}
  .tpl-entry .subsection{margin-left:0;margin-bottom:12px;}

  /* shared icon-button treatment for every "remove" control across the app */
  .del-btn, .tpl-del, .sub-del, .section-del, .instr-item-del, .instr-section-del{
    width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;
    border:none;background:transparent;color:var(--n-400);font-size:15px;line-height:1;
    cursor:pointer;padding:0;border-radius:50%;
  }
  .del-btn:hover, .tpl-del:hover, .sub-del:hover, .section-del:hover, .instr-item-del:hover, .instr-section-del:hover{
    background:rgba(163,59,59,.12);color:#a33b3b;
  }
  .del-btn{grid-column:6;grid-row:1;width:22px;height:22px;font-size:16px;}
  .tpl-del{grid-column:3;width:22px;height:22px;font-size:16px;}
  .sub-del{grid-column:4;grid-row:1;width:18px;height:18px;font-size:13px;}

  /* compact layout */
  .main-wrap.compact .item-desc,
  .main-wrap.compact .item-type-toggle,
  .main-wrap.compact .note-line{display:none;}
  .main-wrap.compact .row{padding:6px 0;}
  .main-wrap.compact .subsection{margin-left:28px;}
  .main-wrap.compact .sub-note-line{display:none;}

  /* ---- instructions view: editable library, styled like a OneNote notebook page ---- */
  #instructionsView{display:none;--onp-color:#416180;}
  #instructionEditor{display:none;}
  #templatesView{display:none;}
  #templateEditor{display:none;}

  #instructionsView, #instructionsView input, #instructionsView select{
    font-family:"Segoe UI","Segoe UI Variable",Calibri,ui-sans-serif,system-ui,sans-serif;
  }

  .onp-page{
    background:#fffdf8;
    border:1px solid var(--color-divider);
    border-radius:var(--radius-lg);
    box-shadow:0 1px 3px rgba(29,31,32,.08), 0 12px 30px rgba(29,31,32,.06);
    padding:30px 42px 46px;
  }

  .onp-category-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .onp-category-swatch{width:16px;height:16px;border-radius:50%;background:var(--onp-color);border:1px solid rgba(0,0,0,.15);padding:0;cursor:pointer;flex-shrink:0;}
  .onp-category-swatch:disabled{cursor:default;opacity:.4;}
  .onp-category-select{border:1px solid var(--color-divider-strong);border-radius:var(--radius-xs);background:var(--color-surface);font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--onp-color);padding:5px 10px;max-width:100%;}

  #instrCategoryForm{max-width:340px;}
  .color-picker-row{display:flex;align-items:center;gap:10px;margin-top:4px;}
  .color-picker-row input[type="color"]{width:36px;height:28px;padding:0;border:1px solid var(--color-divider-strong);border-radius:var(--radius-xs);background:none;cursor:pointer;}
  .color-swatches{display:flex;flex-wrap:wrap;gap:6px;}
  .color-swatch-btn{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer;padding:0;}
  .color-swatch-btn:hover{outline:2px solid var(--color-text);outline-offset:1px;}

<script>
(function(){
"use strict";
const STORAGE_KEY = "docket.attorney.v1";
const CATEGORIES = ["Court Deadline","Filing","Discovery","SOL","Client","Billing","Internal","Checklist"];
const todayISO = () => new Date().toISOString().slice(0,10);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      const parsed = JSON.parse(raw);
      parsed.msftSetupOpen = false;
      parsed.pendingImport = null;
      parsed.caseTypesOpen = false;
      parsed.insuranceTypesOpen = false;
      parsed.editingMatterId = null;
      if (!Array.isArray(parsed.caseTypes)) parsed.caseTypes = [];
      if (!Array.isArray(parsed.insuranceTypes)) parsed.insuranceTypes = [];
      if (!parsed.matterGroupBy) parsed.matterGroupBy = "caseType";
      if (!Array.isArray(parsed.collapsedGroups)) parsed.collapsedGroups = [];
      (parsed.tasks || []).forEach(t => {
        if (t.dueTime && !t.startTime){ t.startTime = t.dueTime; }
        delete t.dueTime;
      });
      return parsed;
    }
  }catch(e){ console.warn("Failed to load saved docket data:", e); }
  const m1 = uid(), m2 = uid();
  return {
    matters: [
      { id: m1, name: "Smith v. Jones", number: "24-CV-1187" },
      { id: m2, name: "Estate of Whitfield", number: "" }
    ],
    tasks: [
      { id: uid(), title: "File answer to complaint", matterId: m1, category: "Filing", priority: "P1",
        due: todayISO(), recur: null, notes: "Confirm service date before calculating the response deadline.",
        steps: [{id:uid(),text:"Draft answer",done:true},{id:uid(),text:"Client review",done:false},{id:uid(),text:"E-file",done:false}],
        done: false, order: 0 },
      { id: uid(), title: "Statute of limitations — verify filing deadline", matterId: m1, category: "SOL", priority: "P1",
        due: todayISO(), recur: null, notes: "", steps: [], done: false, order: 1 },
      { id: uid(), title: "Send engagement letter", matterId: m2, category: "Client", priority: "P2",
        due: null, recur: null, notes: "", steps: [], done: false, order: 2 }
    ],
    filter: "today", matterFilter: null, sort: "due", query: "", selectedId: null,
    caseTypes: [], caseTypesOpen: false, editingMatterId: null,
    insuranceTypes: [], insuranceTypesOpen: false, matterGroupBy: "caseType", collapsedGroups: []
  };
}

let state = loadState();
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function setState(patch){ Object.assign(state, typeof patch === "function" ? patch(state) : patch); save(); render(); }

function findTask(id){ return state.tasks.find(t => t.id === id); }
function patchTask(id, fn){
  state.tasks = state.tasks.map(t => t.id === id ? Object.assign({}, t, fn(t)) : t);
  save(); render();
  if (msftIsConnected()){ const t = findTask(id); if (t) syncTaskToCalendar(t); }
}
function toggleTaskDone(id){
  const t = findTask(id);
  if (!t) return;
  const newDone = !t.done;
  patchTask(id, x => ({ done: newDone }));
  if (t.linkedChecklistId && t.linkedChecklistItemId && window.__CHECKLISTS__ && window.__CHECKLISTS__.setItemDone){
    window.__CHECKLISTS__.setItemDone(t.linkedChecklistId, t.linkedChecklistItemId, newDone);
  }
}
function matterName(id){ const m = state.matters.find(m => m.id === id); return m ? m.name : "No matter"; }
function findCaseType(id){ return state.caseTypes.find(c => c.id === id) || null; }
function findCaseSubtype(typeId, subId){
  const ct = findCaseType(typeId);
  return ct ? (ct.subtypes.find(s => s.id === subId) || null) : null;
}
function findInsuranceType(id){ return state.insuranceTypes.find(i => i.id === id) || null; }

function fmtDue(dueISO){
  if (!dueISO) return "No date";
  const d = new Date(dueISO + "T00:00:00");
  const t = new Date(todayISO() + "T00:00:00");
  const diffDays = Math.round((d - t) / 86400000);
  if (diffDays === 0) return "Today";
  if (diffDays === 1) return "Tomorrow";
  if (diffDays === -1) return "Yesterday";
  if (diffDays < 0) return Math.abs(diffDays) + " day" + (diffDays === -1 ? "" : "s") + " overdue";
  if (diffDays > 0 && diffDays <= 6) return d.toLocaleDateString(undefined,{weekday:"long"});
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year: d.getFullYear() !== t.getFullYear() ? "numeric" : undefined});
}
function isOverdue(t){ return !!t.due && !t.done && t.due < todayISO(); }
function isToday(t){ return !!t.due && t.due === todayISO(); }

function fmtTime(hhmm){
  if (!hhmm) return "";
  const [h, m] = hhmm.split(":").map(Number);
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return h12 + ":" + String(m).padStart(2, "0") + " " + period;
}

function addDays(iso, n){
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}

function parseComposer(raw){
  let title = raw, matterId = state.matterFilter, priority = "P3", due = null;
  const mm = title.match(/#(\S+)/);
  if (mm){
    const key = mm[1].toLowerCase();
    const hit = state.matters.find(m => m.name.toLowerCase().replace(/\s+/g,"").startsWith(key));
    if (hit) matterId = hit.id;
    else {
      const nm = { id: uid(), name: mm[1], number: "" };
      state.matters.push(nm);
      matterId = nm.id;
    }
    title = title.replace(mm[0], "").trim();
  }
  const pm = title.match(/!p([123])/i);
  if (pm){ priority = "P" + pm[1]; title = title.replace(pm[0], "").trim(); }
  const dm = title.match(/@(\S+)/);
  if (dm){
    const v = dm[1].toLowerCase();
    if (v === "today") due = todayISO();
    else if (v === "tomorrow") due = addDays(todayISO(), 1);
    else if (/^\d{4}-\d{2}-\d{2}$/.test(v)) due = v;
    else {
      const days = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
      const idx = days.findIndex(d => d.startsWith(v));
      if (idx >= 0){
        const t = new Date(todayISO() + "T00:00:00");
        let diff = (idx - t.getDay() + 7) % 7;
        if (diff === 0) diff = 7;
        due = addDays(todayISO(), diff);
      }
    }
    title = title.replace(dm[0], "").trim();
  }
  return { title, matterId, priority, due };
}

function addTask(raw){
  const trimmed = raw.trim();
  if (!trimmed) return;
  const parsed = parseComposer(trimmed);
  if (!parsed.title) return;
  const task = {
    id: uid(), title: parsed.title, matterId: parsed.matterId, category: "Internal",
    priority: parsed.priority, due: parsed.due, recur: null, notes: "", steps: [],
    done: false, order: -Date.now()
  };
  state.tasks = [task].concat(state.tasks);
  state.newTitle = "";
  state.selectedId = task.id;
  save(); render();
  if (msftIsConnected()) syncTaskToCalendar(task);
}

function deleteTask(id){
  const existing = findTask(id);
  state.tasks = state.tasks.filter(t => t.id !== id);
  if (state.selectedId === id) state.selectedId = null;
  save(); render();
  if (existing && existing.graphEventId && msftIsConnected()){
    graphDeleteEvent(existing.graphEventId).catch(e => console.warn("Calendar delete failed", e));
  }
}

const CHECKLIST_PRIORITY_MAP = { H: "P1", M: "P2", L: "P3" };

/* ---- Microsoft Calendar sync ----
   Requires the page to be hosted at a real https:// address (not a local
   file) with that exact address registered as a redirect URI on an Azure /
   Entra ID app registration granting the Calendars.ReadWrite Graph scope.
   See the in-app "Connect Microsoft Calendar" setup dialog for the Client ID
   field this reads from. Nothing here runs until the user opts in. */
const MSAL_CDN_URL = "https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js";
const MSFT_CONFIG_KEY = "docket.msftConfig";
const MSFT_SCOPES = ["Calendars.ReadWrite"];

let msalApp = null;
let msalLoadPromise = null;
let msftAccount = null;
let msftBusy = false;
let msftLastError = "";
let msftLastSyncAt = null;

function getMsftConfig(){
  try{ return JSON.parse(localStorage.getItem(MSFT_CONFIG_KEY)) || null; }catch(e){ return null; }
}
function saveMsftConfig(clientId, tenantId){
  localStorage.setItem(MSFT_CONFIG_KEY, JSON.stringify({ clientId: clientId.trim(), tenantId: (tenantId || "common").trim() }));
}
function msftIsConfigured(){ const c = getMsftConfig(); return !!(c && c.clientId); }
function msftIsConnected(){ return !!msftAccount; }

function loadMsalScript(){
  if (window.msal) return Promise.resolve();
  if (msalLoadPromise) return msalLoadPromise;
  msalLoadPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = MSAL_CDN_URL;
    s.onload = () => resolve();
    s.onerror = () => { msalLoadPromise = null; reject(new Error("Could not load the Microsoft sign-in library — check your internet connection.")); };
    document.head.appendChild(s);
  });
  return msalLoadPromise;
}

function clearStuckMsalInteraction(){
  try{
    [window.localStorage, window.sessionStorage].forEach(store => {
      const keys = [];
      for (let i = 0; i < store.length; i++){
        const k = store.key(i);
        if (k && k.toLowerCase().indexOf("interaction.status") >= 0) keys.push(k);
      }
      keys.forEach(k => store.removeItem(k));
    });
  }catch(e){}
}

async function ensureMsalApp(){
  const cfg = getMsftConfig();
  if (!cfg || !cfg.clientId) throw new Error("Microsoft Calendar isn't set up yet — add your Client ID first.");
  await loadMsalScript();
  if (!msalApp){
    const redirectUri = window.location.origin + window.location.pathname;
    msalApp = new window.msal.PublicClientApplication({
      auth: {
        clientId: cfg.clientId,
        authority: "https://login.microsoftonline.com/" + (cfg.tenantId || "common"),
        redirectUri: redirectUri
      },
      cache: { cacheLocation: "localStorage" }
    });
    if (typeof msalApp.initialize === "function") await msalApp.initialize();
    const accounts = msalApp.getAllAccounts();
    if (accounts.length) msftAccount = accounts[0];
  }
  return msalApp;
}

async function connectMicrosoft(){
  if (msftBusy) return;
  msftBusy = true; msftLastError = ""; render();
  clearStuckMsalInteraction();
  try{
    const app = await ensureMsalApp();
    const result = await app.loginPopup({ scopes: MSFT_SCOPES });
    msftAccount = result.account;
  }catch(e){
    const code = e && e.errorCode ? e.errorCode : "";
    if (code === "interaction_in_progress"){
      clearStuckMsalInteraction();
      msftLastError = "A previous sign-in attempt didn't finish cleanly — I've reset it. Click “Sign in to Microsoft” again.";
    } else if (code.indexOf("popup") >= 0 || code === "empty_window_error" || code === "user_cancelled"){
      msftLastError = "Your browser blocked or closed the Microsoft sign-in popup. Allow popups for this site, then click “Sign in to Microsoft” again.";
    } else {
      msftLastError = e && e.message ? e.message : String(e);
    }
  }
  msftBusy = false; render();
}

async function disconnectMicrosoft(){
  if (msalApp && msftAccount){
    try{ await msalApp.logoutPopup({ account: msftAccount }); }catch(e){}
  }
  msftAccount = null;
  render();
}

async function getGraphToken(){
  const app = await ensureMsalApp();
  if (!msftAccount) throw new Error("Not connected to Microsoft.");
  try{
    const result = await app.acquireTokenSilent({ scopes: MSFT_SCOPES, account: msftAccount });
    return result.accessToken;
  }catch(e){
    const result = await app.acquireTokenPopup({ scopes: MSFT_SCOPES, account: msftAccount });
    return result.accessToken;
  }
}

async function graphFetch(path, options){
  const token = await getGraphToken();
  const opts = options || {};
  const res = await fetch("https://graph.microsoft.com/v1.0" + path, Object.assign({}, opts, {
    headers: Object.assign({ "Authorization": "Bearer " + token, "Content-Type": "application/json" }, opts.headers || {})
  }));
  if (res.status === 204) return null;
  if (res.status === 404) return { __notFound: true };
  if (!res.ok){
    const body = await res.text().catch(() => "");
    throw new Error("Microsoft Graph error " + res.status + ": " + body.slice(0, 200));
  }
  return res.json();
}

const USER_TZ = (Intl.DateTimeFormat().resolvedOptions().timeZone) || "UTC";

function taskToGraphEvent(task){
  const bodyParts = [];
  if (task.notes) bodyParts.push(task.notes);
  bodyParts.push("Synced from Docket" + (task.matterId ? " · " + matterName(task.matterId) : ""));
  const subject = task.title + (task.matterId ? " — " + matterName(task.matterId) : "");
  const body = { contentType: "text", content: bodyParts.join("\n\n") };

  if (task.startTime){
    const pad = n => String(n).padStart(2, "0");
    const toLocalISO = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":00";
    const startDate = new Date(task.due + "T" + task.startTime + ":00");
    let endDate = task.endTime ? new Date(task.due + "T" + task.endTime + ":00") : null;
    if (!endDate || endDate <= startDate) endDate = new Date(startDate.getTime() + 30 * 60000);
    return {
      subject, body, isAllDay: false,
      start: { dateTime: toLocalISO(startDate), timeZone: USER_TZ },
      end: { dateTime: toLocalISO(endDate), timeZone: USER_TZ }
    };
  }
  return {
    subject, body, isAllDay: true,
    start: { dateTime: task.due + "T00:00:00", timeZone: USER_TZ },
    end: { dateTime: addDays(task.due, 1) + "T00:00:00", timeZone: USER_TZ }
  };
}

async function graphCreateEvent(task){
  const data = await graphFetch("/me/events", { method: "POST", body: JSON.stringify(taskToGraphEvent(task)) });
  return data.id;
}
async function graphUpdateEvent(task){
  const data = await graphFetch("/me/events/" + encodeURIComponent(task.graphEventId), { method: "PATCH", body: JSON.stringify(taskToGraphEvent(task)) });
  if (data && data.__notFound) return graphCreateEvent(task);
  return task.graphEventId;
}
async function graphDeleteEvent(eventId){
  await graphFetch("/me/events/" + encodeURIComponent(eventId), { method: "DELETE" });
}

function setTaskGraphId(id, graphEventId){
  state.tasks = state.tasks.map(t => t.id === id ? Object.assign({}, t, { graphEventId }) : t);
  save();
}
function setTaskFieldsSilent(id, fields){
  state.tasks = state.tasks.map(t => t.id === id ? Object.assign({}, t, fields) : t);
  save();
}

async function syncTaskToCalendar(task){
  if (!task || !msftIsConnected()) return;
  try{
    if (task.done || !task.due){
      if (task.graphEventId){
        await graphDeleteEvent(task.graphEventId);
        setTaskGraphId(task.id, null);
      }
      return;
    }
    if (task.graphEventId){
      const resultId = await graphUpdateEvent(task);
      if (resultId !== task.graphEventId) setTaskGraphId(task.id, resultId);
    } else {
      const eventId = await graphCreateEvent(task);
      setTaskGraphId(task.id, eventId);
    }
  }catch(e){
    console.warn("Calendar sync failed for task", task.id, e);
    msftLastError = e && e.message ? e.message : String(e);
  }
}

async function syncNow(){
  if (!msftIsConnected()){ alert("Connect Microsoft Calendar first."); return; }
  msftBusy = true; msftLastError = ""; render();
  try{
    const pushable = state.tasks.filter(t => t.due && !t.done);
    for (const t of pushable) await syncTaskToCalendar(t);
    const doneOrGone = state.tasks.filter(t => t.graphEventId && (t.done || !t.due));
    for (const t of doneOrGone) await syncTaskToCalendar(t);

    const tracked = state.tasks.filter(t => t.graphEventId);
    for (const t of tracked){
      try{
        const ev = await graphFetch("/me/events/" + encodeURIComponent(t.graphEventId), { method: "GET" });
        if (ev.__notFound){ setTaskGraphId(t.id, null); continue; }
        const remoteDate = ((ev.start && ev.start.dateTime) || "").slice(0, 10);
        if (remoteDate && remoteDate !== t.due) setTaskFieldsSilent(t.id, { due: remoteDate });
      }catch(e){ console.warn("Pull failed for task", t.id, e); }
    }
    msftLastSyncAt = new Date();
  }catch(e){
    msftLastError = e && e.message ? e.message : String(e);
  }
  msftBusy = false; render();
}

function findMatterByName(name){
  const key = (name || "").trim().toLowerCase();
  if (!key) return null;
  return state.matters.find(m => m.name.trim().toLowerCase() === key) || null;
}

function openChecklistImport(checklist){
  if (!checklist || !Array.isArray(checklist.sections)){
    alert("That file doesn't look like a checklist export.");
    return;
  }
  const client = (checklist.meta && checklist.meta.client) || "";
  const match = findMatterByName(client);
  const itemCount = checklist.sections.reduce((n, s) => n + (s.items || []).filter(it => (it.text||"").trim()).length, 0);
  state.pendingImport = {
    checklist, itemCount,
    sectionCount: checklist.sections.length,
    targetMatterId: match ? match.id : "__new__",
    newMatterName: client || checklist.title || "New matter",
    newMatterNumber: (checklist.meta && checklist.meta.caseNumber) || ""
  };
  render();
}

function confirmChecklistImport(){
  const pending = state.pendingImport;
  if (!pending) return;
  let matterId = pending.targetMatterId;
  if (matterId === "__new__"){
    const name = (pending.newMatterName || "").trim();
    if (!name){ alert("Enter a name for the new matter."); return; }
    const m = { id: uid(), name, number: pending.newMatterNumber || "" };
    state.matters.push(m);
    matterId = m.id;
  }
  const cl = pending.checklist;
  let order = -Date.now();
  cl.sections.forEach(section => {
    const sectionLabel = (section.title || "").trim();
    const prefix = sectionLabel && sectionLabel.toLowerCase() !== "checklist" ? sectionLabel + " — " : "";
    (section.items || []).forEach(item => {
      const text = (item.text || "").trim();
      if (!text) return;
      const notesParts = [];
      if (item.desc && item.desc.trim()) notesParts.push(item.desc.trim());
      if (item.notes && item.notes.trim()) notesParts.push(item.notes.trim());
      const steps = (item.subitems || [])
        .filter(s => (s.text||"").trim())
        .map(s => ({ id: uid(), text: s.text.trim(), done: !!s.done }));
      state.tasks.push({
        id: uid(), title: prefix + text, matterId,
        category: "Checklist",
        priority: CHECKLIST_PRIORITY_MAP[item.priority] || "P3",
        due: null, recur: null,
        notes: notesParts.join("\n\n"),
        steps, done: !!item.done, order: order++
      });
    });
  });
  state.pendingImport = null;
  state.matterFilter = matterId;
  state.filter = "all";
  save(); render();
}

function filteredTasks(){
  const q = (state.query || "").trim().toLowerCase();
  let list = state.tasks.filter(t => {
    if (state.matterFilter) return t.matterId === state.matterFilter && !t.done;
    if (state.filter === "overdue") return isOverdue(t);
    if (state.filter === "today") return !t.done && (isToday(t) || isOverdue(t));
    if (state.filter === "upcoming") return !t.done && t.due && t.due > todayISO();
    if (state.filter === "done") return t.done;
    return !t.done;
  });
  if (q) list = list.filter(t =>
    (t.title + " " + matterName(t.matterId) + " " + (t.notes||"") + " " + t.category).toLowerCase().includes(q)
  );
  if (state.sort === "due") list = list.slice().sort((a,b) => {
    const ka = (a.due||"9999") + "T" + (a.startTime||"00:00");
    const kb = (b.due||"9999") + "T" + (b.startTime||"00:00");
    return ka < kb ? -1 : ka > kb ? 1 : 0;
  });
  else if (state.sort === "priority") list = list.slice().sort((a,b) => a.priority.localeCompare(b.priority));
  else list = list.slice().sort((a,b) => a.order - b.order);
  return list;
}

function el(tag, attrs, children){
  const node = document.createElement(tag);
  for (const k in (attrs||{})){
    if (k === "class") node.className = attrs[k];
    else if (k === "html") node.innerHTML = attrs[k];
    else if (k.startsWith("on")) node.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if (attrs[k] !== undefined && attrs[k] !== null) node.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c => { if (c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return node;
}

let dragId = null;
let moreMenuOpen = false;

function isGroupCollapsed(key){ return state.collapsedGroups.includes(key); }
function toggleGroup(key){
  state.collapsedGroups = isGroupCollapsed(key)
    ? state.collapsedGroups.filter(k => k !== key)
    : state.collapsedGroups.concat([key]);
  save(); render();
}
function groupLabelEl(text, key, sub){
  const collapsed = isGroupCollapsed(key);
  return el("button", {
    class: (sub ? "matter-subgroup-label" : "matter-group-label") + " group-toggle",
    onclick: () => toggleGroup(key)
  }, [(collapsed ? "▸ " : "▾ ") + text]);
}

function renderMatterRow(m, openTasks, indentPx){
  const active = state.matterFilter === m.id;
  const count = openTasks.filter(t => t.matterId === m.id).length;
  const row = el("div", { class: "matter-row" + (active ? " active" : ""), style: indentPx ? ("padding-left:" + (6 + indentPx) + "px") : "" });
  row.appendChild(el("span", { class: "dot" }));
  row.appendChild(el("button", { class: "name", onclick: () => setState({ matterFilter: active ? null : m.id }) }, [m.name]));
  row.appendChild(el("span", { class: "count" }, [String(count)]));
  const clList = window.__CHECKLISTS__ ? window.__CHECKLISTS__.getChecklistsForMatter(m.id) : [];
  if (clList.length){
    row.appendChild(el("button", {
      class: "cl-badge", title: clList.length + " checklist" + (clList.length === 1 ? "" : "s") + " — open",
      onclick: () => {
        window.__CHECKLISTS__.openChecklist(clList[0].id);
        if (window.__activateApp) window.__activateApp("checklists");
      }
    }, ["📋 " + clList.length]));
  }
  row.appendChild(el("button", {
    class: "edit", title: "Edit matter",
    onclick: () => setState({ editingMatterId: m.id })
  }, ["✎"]));
  row.appendChild(el("button", {
    class: "del", title: "Delete matter",
    onclick: () => {
      if (!confirm('Delete matter "' + m.name + '"? Its tasks will move to "No matter".')) return;
      state.matters = state.matters.filter(x => x.id !== m.id);
      state.tasks = state.tasks.map(t => t.matterId === m.id ? {...t, matterId: null} : t);
      if (state.matterFilter === m.id) state.matterFilter = null;
      save(); render();
    }
  }, ["✕"]));
  return row;
}

function renderTaskRow(t, expandedId){
  const wrap = el("div", { class: "task" });
  const expanded = expandedId === t.id;
  const row = el("div", {
    class: "task-row" + (state.selectedId === t.id ? " selected" : "") + (t.done ? " done" : ""),
    draggable: "true",
    onclick: () => setState({ selectedId: t.id, expandedId: expanded ? null : t.id })
  });
  row.addEventListener("dragstart", () => { dragId = t.id; });
  row.addEventListener("dragover", e => e.preventDefault());
  row.addEventListener("drop", e => {
    e.preventDefault();
    if (!dragId || dragId === t.id) return;
    const list = state.tasks.slice();
    const fi = list.findIndex(x => x.id === dragId), ti = list.findIndex(x => x.id === t.id);
    if (fi < 0 || ti < 0) return;
    const [m] = list.splice(fi,1); list.splice(ti,0,m);
    list.forEach((x,i) => x.order = i);
    state.tasks = list; state.sort = "manual"; save(); render();
  });

  const box = el("button", {
    class: "checkbox" + (t.done ? " checked" : ""),
    onclick: e => { e.stopPropagation(); toggleTaskDone(t.id); }
  });

  const main = el("div", { class: "task-main" });
  main.appendChild(el("div", { class: "task-title" + (t.done ? " done" : "") }, [t.title]));
  const meta = el("div", { class: "task-meta" });
  meta.appendChild(el("span", { class: "meta-matter" }, [matterName(t.matterId)]));
  meta.appendChild(el("span", { class: "meta-due" + (isOverdue(t) ? " overdue" : isToday(t) ? " today" : "") }, [fmtDue(t.due) + (t.due && t.startTime ? " · " + fmtTime(t.startTime) + (t.endTime ? "–" + fmtTime(t.endTime) : "") : "")]));
  if (t.steps.length) meta.appendChild(el("span", {}, [t.steps.filter(s=>s.done).length + "/" + t.steps.length + " steps"]));
  if (t.recur) meta.appendChild(el("span", {}, ["↻ " + t.recur]));
  main.appendChild(meta);
  row.appendChild(el("span", { style: "width:14px" }));
  row.appendChild(box);
  row.appendChild(main);

  const right = el("div", { class: "task-right" });
  right.appendChild(el("span", { class: "tag tag-cat" }, [t.category]));
  right.appendChild(el("span", { class: "tag tag-" + t.priority.toLowerCase() }, [t.priority]));
  right.appendChild(el("button", {
    class: "edit-hint", title: "Edit this task",
    onclick: e => { e.stopPropagation(); setState({ selectedId: t.id }); }
  }, ["✎ Edit"]));
  right.appendChild(el("span", { class: "chev" + (expanded ? " open" : ""), html: "&rsaquo;" }));
  row.appendChild(right);
  wrap.appendChild(row);

  if (expanded){
    const panel = el("div", { class: "steps-preview" });
    t.steps.forEach(s => {
      const line = el("div", { class: "step-line" });
      line.appendChild(el("button", {
        class: "checkbox" + (s.done ? " checked" : ""),
        onclick: e => { e.stopPropagation(); patchTask(t.id, x => ({ steps: x.steps.map(y => y.id===s.id ? {...y, done: !y.done} : y) })); }
      }));
      line.appendChild(el("span", { class: "txt" + (s.done ? " done" : "") }, [s.text]));
      panel.appendChild(line);
    });
    if (t.notes) panel.appendChild(el("div", { style: "font-size:13px;line-height:1.55;color:var(--muted);border-left:2px solid var(--accent);padding-left:10px" }, [t.notes]));
    const actions = el("div", { style: "display:flex;gap:8px" });
    actions.appendChild(el("button", { class: "btn btn-sm", onclick: e => { e.stopPropagation(); patchTask(t.id, x => ({ due: addDays(todayISO(),1) })); } }, ["Push to tomorrow"]));
    actions.appendChild(el("button", { class: "btn btn-sm btn-danger", onclick: e => { e.stopPropagation(); if (confirm("Delete this task?")) deleteTask(t.id); } }, ["Delete"]));
    panel.appendChild(actions);
    wrap.appendChild(panel);
  }
  return wrap;
}

function render(){
  const root = document.getElementById("app");
  root.innerHTML = "";
  root.className = "app" + ((state.selectedId && findTask(state.selectedId)) ? "" : " no-detail");

  const open = state.tasks.filter(t => !t.done);
  const overdueCount = state.tasks.filter(isOverdue).length;
  const todayCount = state.tasks.filter(t => !t.done && (isToday(t) || isOverdue(t))).length;
  const upcomingCount = state.tasks.filter(t => !t.done && t.due && t.due > todayISO()).length;
  const doneCount = state.tasks.filter(t => t.done).length;

  // Sidebar
  const sidebar = el("div", { class: "sidebar" });
  const brand = el("div", { class: "brand" }, [
    el("h1", {}, ["DOCKET"]),
    el("span", { class: "sub" }, [open.length + " open"])
  ]);
  sidebar.appendChild(brand);
  sidebar.appendChild(el("div", { class: "today-date" }, [new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})]));
  sidebar.appendChild(el("button", { class: "btn btn-primary btn-block", onclick: () => { const i = document.getElementById("composerInput"); if (i) i.focus(); } }, ["+ Add task"]));

  const views = el("div", {});
  views.appendChild(el("div", { class: "section-label" }, ["Views"]));
  const navList = el("div", { class: "nav-list" });
  [
    ["overdue","Overdue",overdueCount,true],
    ["today","Today",todayCount,false],
    ["upcoming","Upcoming",upcomingCount,false],
    ["all","All open",open.length,false],
    ["done","Done",doneCount,false]
  ].forEach(([key,label,count,dangerRow]) => {
    const active = !state.matterFilter && state.filter === key;
    navList.appendChild(el("button", {
      class: "nav-row" + (active ? " active" : "") + (dangerRow ? " overdue" : ""),
      onclick: () => setState({ filter: key, matterFilter: null })
    }, [
      el("span", {}, [label]),
      el("span", { class: "count" }, [String(count)])
    ]));
  });
  views.appendChild(navList);
  sidebar.appendChild(views);

  const mattersBlock = el("div", {});
  const mattersHead = el("div", { class: "matters-head" });
  mattersHead.appendChild(el("div", { class: "section-label" }, ["Matters"]));
  const groupBySel = el("select", { class: "group-by-sel" });
  [["caseType","By case type"],["insurance","By insurance"],["none","No grouping"]].forEach(([v,l]) => {
    const opt = el("option", { value: v }, [l]);
    if (state.matterGroupBy === v) opt.setAttribute("selected", "selected");
    groupBySel.appendChild(opt);
  });
  groupBySel.addEventListener("change", e => setState({ matterGroupBy: e.target.value }));
  mattersHead.appendChild(groupBySel);
  mattersBlock.appendChild(mattersHead);

  const manageRow = el("div", { class: "manage-row" });
  manageRow.appendChild(el("button", { class: "manage-link", onclick: () => setState({ caseTypesOpen: true }) }, ["Manage types"]));
  manageRow.appendChild(el("button", { class: "manage-link", onclick: () => setState({ insuranceTypesOpen: true }) }, ["Manage insurance"]));
  mattersBlock.appendChild(manageRow);

  const matterList = el("div", { class: "nav-list" });

  if (state.matterGroupBy === "caseType"){
    const assignedIds = new Set();
    state.caseTypes.forEach(ct => {
      const mattersOfType = state.matters.filter(m => m.caseTypeId === ct.id);
      if (!mattersOfType.length) return;
      mattersOfType.forEach(m => assignedIds.add(m.id));
      const groupKey = "ct:" + ct.id;
      const group = el("div", { class: "matter-group" });
      group.appendChild(groupLabelEl(ct.name, groupKey, false));
      if (!isGroupCollapsed(groupKey)){
        mattersOfType.filter(m => !m.caseSubtypeId || !findCaseSubtype(ct.id, m.caseSubtypeId)).forEach(m => {
          group.appendChild(renderMatterRow(m, open, 0));
        });
        ct.subtypes.forEach(st => {
          const subMatters = mattersOfType.filter(m => m.caseSubtypeId === st.id);
          if (!subMatters.length) return;
          const subKey = groupKey + ":st:" + st.id;
          group.appendChild(groupLabelEl(st.name, subKey, true));
          if (!isGroupCollapsed(subKey)) subMatters.forEach(m => group.appendChild(renderMatterRow(m, open, 14)));
        });
      }
      matterList.appendChild(group);
    });
    const uncategorized = state.matters.filter(m => !assignedIds.has(m.id));
    if (uncategorized.length){
      const group = el("div", { class: "matter-group" });
      const ucKey = "ct:none";
      if (state.caseTypes.length) group.appendChild(groupLabelEl("Uncategorized", ucKey, false));
      if (!state.caseTypes.length || !isGroupCollapsed(ucKey)){

  function readJSONFile(file, onOk, onErr){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        onOk(parsed);
      }catch(e){
        onErr(e);
      }
    };
    reader.onerror = function(){ onErr(reader.error); };
    reader.readAsText(file);
  }

  // Follow-up items (subitems) only count toward totals when they're actually
  // reachable: always for a plain checkbox item, and only on the "Yes" branch
  // of a yes/no item — a "No" answer means that branch was never entered.
  function itemTotals(it){
    var total = 1, done = it.done ? 1 : 0;
    var followUpsReachable = it.type !== "yesno" || it.answer === "yes";
    if(followUpsReachable){
      it.subitems.forEach(function(sub){ total++; if(sub.done) done++; });
    }
    return { total: total, done: done };
  }

  function checklistTotals(cs){
    var total = 0, done = 0;
    cs.sections.forEach(function(s){
      s.items.forEach(function(it){
        var t = itemTotals(it);
        total += t.total; done += t.done;
      });
    });
    return { total: total, done: done };
  }

  function populateInstructionSelect(selectEl, selectedId){
    selectEl.innerHTML = "";

    none.value = "";
    none.textContent = "— No link —";
    selectEl.appendChild(none);

      selectEl.appendChild(noneYet);
      return;
    }

    var byCategory = {};
    var catOrder = [];
    state.instructionTopics.forEach(function(def){
      var key = def.categoryId || "__none__";
      if(!byCategory[key]){ byCategory[key] = []; catOrder.push(key); }
      byCategory[key].push(def);
    });
    catOrder.sort(function(a, b){
      if(a === "__none__") return b === "__none__" ? 0 : 1;
      if(b === "__none__") return -1;
      var catA = instructionCategoryById(a), catB = instructionCategoryById(b);
      return (catA ? catA.name : "").localeCompare(catB ? catB.name : "");
    });

    catOrder.forEach(function(key){
      var cat = key === "__none__" ? null : instructionCategoryById(key);
      var group = document.createElement("optgroup");
      group.label = cat ? cat.name : "Uncategorized";
      byCategory[key].slice().sort(function(a, b){ return (a.title||"").localeCompare(b.title||""); }).forEach(function(def){
        var opt = document.createElement("option");
        opt.value = def.id;
        opt.textContent = def.title || "Untitled";
        if(def.id === selectedId) opt.selected = true;
        group.appendChild(opt);
      });
      selectEl.appendChild(group);
    });

  function renderTemplatesSidebar(){
    var q = searchQuery.trim().toLowerCase();

    function buildTypeGroup(label, type, list){
      var matches = list.filter(function(t){ return !q || t.title.toLowerCase().indexOf(q) !== -1; });

      var group = document.createElement("div");
      group.className = "nav-group";
      var typeLabelEl = document.createElement("div");
      typeLabelEl.className = "nav-type-label";
      typeLabelEl.textContent = label;
      group.appendChild(typeLabelEl);

      if(!list.length){
        var empty = document.createElement("div");
        empty.className = "nav-empty";
        empty.textContent = "None yet.";
        group.appendChild(empty);
        navGroupsEl.appendChild(group);
        return;
      }
      if(!matches.length){
        var noMatch = document.createElement("div");
        noMatch.className = "nav-empty";
        noMatch.textContent = "No matches.";
        group.appendChild(noMatch);
        navGroupsEl.appendChild(group);
        return;
      }

      // group by category — templates without one fall into "Uncategorized"
      var byCategory = {};
      var catOrder = [];
      matches.forEach(function(t){
        var cat = (t.category || "").trim() || "Uncategorized";
        if(!byCategory[cat]){ byCategory[cat] = []; catOrder.push(cat); }
        byCategory[cat].push(t);
      });
      catOrder.sort(function(a, b){
        if(a === "Uncategorized") return b === "Uncategorized" ? 0 : 1;
        if(b === "Uncategorized") return -1;
        return a.localeCompare(b);
      });
      var showCatLabels = catOrder.length > 1 || catOrder[0] !== "Uncategorized";

      catOrder.forEach(function(cat){
        if(showCatLabels){
          var catLabel = document.createElement("div");
          catLabel.className = "nav-subcat-label";
          catLabel.textContent = cat;
          group.appendChild(catLabel);
        }
        var catItems = byCategory[cat].slice().sort(function(a, b){ return (a.title||"").localeCompare(b.title||""); });
        catItems.forEach(function(t){
          var btn = document.createElement("button");
          btn.className = "nav-item" + (showCatLabels ? " nested" : "") + (state.activeTemplateType === type && state.activeTemplateId === t.id ? " active" : "");
          btn.type = "button";

          var nameSpan = document.createElement("span");
          nameSpan.textContent = t.title || "Untitled";
          btn.appendChild(nameSpan);

          var countSpan = document.createElement("span");
          countSpan.className = "nav-count";
          countSpan.textContent = String(templateItemCount(t));
          btn.appendChild(countSpan);

          btn.addEventListener("click", function(){
            state.activeTemplateType = type;
            state.activeTemplateId = t.id;
            save();
            renderSidebar();
            renderMain();
            window.scrollTo(0,0);
          });

          group.appendChild(btn);
        });
      });

      navGroupsEl.appendChild(group);
    }

    buildTypeGroup("Section templates", "section", state.sectionTemplates);
    buildTypeGroup("Subsection templates", "subsection", state.subsectionTemplates);
